# A service defined more than once for one host, by definitions that do
# not name the same hosts. See `duplicate-service-first-host` for what
# the first host of a definition is.
#
# A definition that names the host in `host_name` is kept over one that
# reaches it through a host group, whichever comes first.
#
# Between two definitions of the same sort:
#
#   - on the first host of both the later definition is kept;
#   - on a host that is the first host of one only, the other is kept;
#   - on every other host the earlier definition is kept.

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

define host {
    use             base-host
    host_name       beta
    address         192.0.2.2
}

# Its first host is beta, the last member written.
define hostgroup {
    hostgroup_name  both
    members         alpha,beta
}

define hostgroup {
    hostgroup_name  only-alpha
    members         alpha
}

define hostgroup {
    hostgroup_name  nested
    hostgroup_members   only-alpha
}

# The last of three is kept.
define service {
    use                     base-service
    host_name alpha
    service_description     three-by-name
    notes                   first
}

define service {
    use                     base-service
    host_name alpha
    service_description     three-by-name
    notes                   second
}

define service {
    use                     base-service
    host_name alpha
    service_description     three-by-name
    notes                   third
}

# alpha is the first host of both: the later one is kept.
define service {
    use                     base-service
    host_name alpha,beta
    service_description     names-big-then-small
    notes                   first
}

define service {
    use                     base-service
    host_name alpha
    service_description     names-big-then-small
    notes                   second
}

# beta is the first host of the earlier one only: the later one is kept.
define service {
    use                     base-service
    host_name beta
    service_description     names-small-then-big
    notes                   first
}

define service {
    use                     base-service
    host_name alpha,beta
    service_description     names-small-then-big
    notes                   second
}

# beta is the first host of the later one only: the earlier one is kept.
define service {
    use                     base-service
    host_name alpha,beta
    service_description     names-second-not-first
    notes                   first
}

define service {
    use                     base-service
    host_name beta
    service_description     names-second-not-first
    notes                   second
}

# The later one has no first host: the earlier one is kept on beta.
define service {
    use                     base-service
    host_name alpha,beta
    service_description     names-neither-first
    notes                   first
}

define service {
    use                     base-service
    host_name alpha,beta,!alpha
    service_description     names-neither-first
    notes                   second
}

# alpha is the first host of the later one only: the earlier one is kept.
define service {
    use                     base-service
    hostgroup_name both
    service_description     groups-big-then-small
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name only-alpha
    service_description     groups-big-then-small
    notes                   second
}

# alpha is the first host of the earlier one only: the later one is kept.
define service {
    use                     base-service
    hostgroup_name only-alpha
    service_description     groups-small-then-big
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name both
    service_description     groups-small-then-big
    notes                   second
}

# alpha is the first host of the second and the third: the first is kept.
define service {
    use                     base-service
    hostgroup_name both
    service_description     three-groups
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name only-alpha
    service_description     three-groups
    notes                   second
}

define service {
    use                     base-service
    hostgroup_name nested
    service_description     three-groups
    notes                   third
}

# The one by host name is kept on alpha, between two by group.
define service {
    use                     base-service
    hostgroup_name both
    service_description     group-name-group
    notes                   first
}

define service {
    use                     base-service
    host_name alpha
    service_description     group-name-group
    notes                   second
}

define service {
    use                     base-service
    hostgroup_name only-alpha
    service_description     group-name-group
    notes                   third
}

# A definition with both settings counts as by host name for the hosts `host_name` names.
define service {
    use                     base-service
    host_name alpha
    hostgroup_name only-alpha
    service_description     both-then-group
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name both
    service_description     both-then-group
    notes                   second
}

# `host_name *` counts as naming the host.
define service {
    use                     base-service
    hostgroup_name both
    service_description     group-then-star
    notes                   first
}

define service {
    use                     base-service
    host_name *
    service_description     group-then-star
    notes                   second
}

# The same, the other way round.
define service {
    use                     base-service
    host_name *
    service_description     star-then-group
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name both
    service_description     star-then-group
    notes                   second
}

