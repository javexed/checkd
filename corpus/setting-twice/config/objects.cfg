# The same setting twice in one definition. Which line counts?

define host {
    use                 base-host
    host_name           alpha
    address             192.0.2.10
    alias               first alias
    alias               second alias
}

define service {
    use                     base-service
    host_name               alpha
    service_description     Ping
    max_check_attempts      4
    max_check_attempts      6
}

# The older name and the newer name of one setting.
define service {
    use                     base-service
    host_name               alpha
    service_description     Load
    normal_check_interval   7
    check_interval          9
}
