# "host" is taken for host_name on a service, but not on a hostextinfo.

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.1
}

define host {
    use         base-host
    host_name   beta
    address     192.0.2.2
}

define host {
    use         base-host
    host_name   gamma
    address     192.0.2.3
    hostgroups  db
}

define hostgroup {
    hostgroup_name  web
    members         alpha,beta
}

define hostgroup {
    hostgroup_name  db
}

define hostgroup {
    hostgroup_name  mixed
    members         alpha,gamma
}

define service {
    use                     base-service
    host_name               alpha,beta
    service_description     ping
}

define service {
    use                     base-service
    host_name               alpha
    service_description     ssh
}

define hostextinfo {
    host        alpha
    notes       x
}
