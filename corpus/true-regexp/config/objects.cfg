# use_true_regexp_matching=1: every name is a regular expression, with or
# without special characters.

define host {
    use         base-host
    host_name   web-1
    address     192.0.2.10
}

define host {
    use         base-host
    host_name   web-2
    address     192.0.2.11
}

define host {
    use         base-host
    host_name   db-1
    address     192.0.2.12
}

define host {
    use         base-host
    host_name   webcam
    address     192.0.2.13
}

# "web" has no special character. It matches web-1, web-2 and webcam.
define service {
    use                     base-service
    host_name               web
    service_description     Plain text
}

define service {
    use                     base-service
    host_name               ^web-
    service_description     Anchored
}

# An exact host name still works, and here it is also a pattern.
define service {
    use                     base-service
    host_name               db-1
    service_description     Exact name
}

define hostgroup {
    hostgroup_name  hg-ones
    members         -1
}
