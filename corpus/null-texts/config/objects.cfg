# `null` in free-text settings. For an alias and an address it is the text
# "null". For the other texts it means "no value".

define host {
    name            with-texts
    use             base-host
    register        0
    alias           Template alias
    display_name    Template display name
    address         192.0.2.9
    notes           Template notes
    notes_url       https://template.example/notes
    action_url      https://template.example/action
    icon_image      template.png
    icon_image_alt  Template icon
    vrml_image      template.wrl
    statusmap_image template.gd2
}

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

# Nothing inherited.
define host {
    use             base-host
    host_name       beta
    alias           null
    display_name    null
    address         null
    notes           null
    notes_url       null
    action_url      null
    icon_image      null
    icon_image_alt  null
    vrml_image      null
    statusmap_image null
}

# The same over inherited values.
define host {
    use             with-texts
    host_name       gamma
    alias           null
    display_name    null
    address         null
    notes           null
    notes_url       null
    action_url      null
    icon_image      null
    icon_image_alt  null
    vrml_image      null
    statusmap_image null
}

# For settings that name other objects `null` means "none".
# The host is left without a check command.
define host {
    use             base-host
    host_name       delta
    address         192.0.2.4
    parents         null
    hostgroups      null
    check_command   null
}

define service {
    use                     base-service
    host_name               alpha
    service_description     ping
    display_name            null
    notes                   null
}

define contact {
    use             base-contact
    contact_name    amy
    alias           null
    email           null
    pager           null
    address1        null
}

define hostgroup {
    hostgroup_name  web
    alias           null
    notes           null
    notes_url       null
    action_url      null
    members         alpha
}

define servicegroup {
    servicegroup_name   pings
    alias               null
    notes               null
    members             alpha,ping
}
