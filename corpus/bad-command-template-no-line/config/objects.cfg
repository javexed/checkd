# A command with a name and no line. A template name does not make it a
# template: only a missing `command_name` does (`templates-nameless`).

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

define service {
    use                     base-service
    host_name               alpha
    service_description     ping
}

define command {
    name            line-comes-later
    command_name    no-line
}
