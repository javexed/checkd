# Service parents written as pairs of host name and description. The
# "parents" case has one description alone, and one pair on another host.

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.10
}

define host {
    use         base-host
    host_name   beta
    address     192.0.2.11
}

define host {
    use         base-host
    host_name   gamma
    address     192.0.2.12
}

define service {
    use                     base-service
    host_name               alpha,beta,gamma
    service_description     Ping
}

define service {
    use                     base-service
    host_name               alpha,beta
    service_description     Load
}

define hostgroup {
    hostgroup_name  hg-all
    members         alpha,beta,gamma
}

define hostgroup {
    hostgroup_name  hg-ab
    members         alpha,beta
}

# One pair, on the service's own host.
define service {
    use                     base-service
    host_name               alpha
    service_description     One pair on own host
    parents                 alpha,Ping
}

# Two pairs, one on the service's own host.
define service {
    use                     base-service
    host_name               alpha
    service_description     Two pairs
    parents                 alpha,Ping,beta,Load
}

# Two pairs on another host.
define service {
    use                     base-service
    host_name               alpha
    service_description     Two pairs elsewhere
    parents                 beta,Ping,beta,Load
}
