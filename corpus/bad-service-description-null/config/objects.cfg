# `service_description null` is no description, not a service called
# "null".

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

define service {
    use                     base-service
    host_name               alpha
    service_description     ping
}

define service {
    use                     base-service
    host_name               alpha
    service_description     null
}
