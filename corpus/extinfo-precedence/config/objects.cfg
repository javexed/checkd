# Which value a host or service ends up with when it has its own value,
# a value from a template, and one or more extinfo definitions.

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.1
}

define host {
    use         base-host
    host_name   beta
    address     192.0.2.2
}

define host {
    use         base-host
    host_name   gamma
    address     192.0.2.3
    hostgroups  db
}

define hostgroup {
    hostgroup_name  web
    members         alpha,beta
}

define hostgroup {
    hostgroup_name  db
}

define hostgroup {
    hostgroup_name  mixed
    members         alpha,gamma
}

define service {
    use                     base-service
    host_name               alpha,beta
    service_description     ping
}

define service {
    use                     base-service
    host_name               alpha
    service_description     ssh
}

# The host's own value stays, whether the extinfo is read after it...
define host {
    use         base-host
    host_name   delta
    address     192.0.2.4
    notes       own notes
    icon_image  own.png
}

define hostextinfo {
    host_name   delta
    notes       ext notes
    notes_url   http://ext.example/delta
    icon_image  ext.png
}

# ...or before it.
define hostextinfo {
    host_name   epsilon
    notes       ext notes read first
    icon_image  ext-first.png
}

define host {
    use         base-host
    host_name   epsilon
    address     192.0.2.5
    notes       own notes read second
}

# A value from a host template stays too.
define host {
    name        noted
    use         base-host
    notes       template notes
    register    0
}

define host {
    use         noted
    host_name   zeta
    address     192.0.2.6
}

define hostextinfo {
    host_name   zeta
    notes       ext notes
}

# "null" on the host leaves room for the extinfo value.
define host {
    use         base-host
    host_name   eta
    address     192.0.2.7
    notes       null
}

define hostextinfo {
    host_name   eta
    notes       ext notes
}

# Of several extinfo definitions the one read last wins, setting by setting.
define hostextinfo {
    host_name   alpha
    notes       first
    notes_url   http://ext.example/first
    action_url  http://ext.example/first
}

define hostextinfo {
    host_name   alpha
    notes       second
    notes_url   http://ext.example/second
}

define hostextinfo {
    host_name   alpha
    notes       third
}

# It makes no difference whether the host is named or reached by a group.
define hostextinfo {
    hostgroup_name  web
    icon_image      group-first.png
    icon_image_alt  group first
}

define hostextinfo {
    host_name       beta
    icon_image      host-second.png
}

define hostextinfo {
    hostgroup_name  web
    vrml_image      group-third.vrml
    icon_image      group-third.png
}

# "null" in an extinfo is no value: the earlier definition shows through.
define hostextinfo {
    host_name   gamma
    notes       earlier
}

define hostextinfo {
    host_name   gamma
    notes       null
}

# The same for services.
define service {
    use                     base-service
    host_name               gamma
    service_description     http
    notes                   own service notes
    icon_image              own.png
}

define serviceextinfo {
    host_name               gamma
    service_description     http
    notes                   ext service notes
    notes_url               http://ext.example/http
    icon_image              ext.png
}

define serviceextinfo {
    host_name               alpha
    service_description     ping
    notes                   first
    notes_url               http://ext.example/first
}

define serviceextinfo {
    host_name               alpha
    service_description     ping
    notes                   second
    action_url              http://ext.example/second
}
