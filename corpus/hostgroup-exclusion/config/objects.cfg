# "!" in the members of a host group. The docs describe "!" for services
# and escalations and say nothing about it here.

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.10
}

define host {
    use         base-host
    host_name   beta
    address     192.0.2.11
}

define host {
    use         base-host
    host_name   gamma
    address     192.0.2.12
}

define host {
    use         base-host
    host_name   delta
    address     192.0.2.13
}

define hostgroup {
    hostgroup_name  hg-web
    members         alpha,beta
}

define hostgroup {
    hostgroup_name  hg-not-alpha
    members         *,!alpha
}

define hostgroup {
    hostgroup_name  hg-listed-minus-one
    members         alpha,beta,gamma,!beta
}
