# A list setting given twice in one definition. For the `members` of a group
# and for its member groups the lines are added together, and a `!` or a `*`
# on one line works on the hosts of the other. For every other list the
# later line counts, as it does for a single value.

define contact {
    use             base-contact
    contact_name    amy
}

define contact {
    use             base-contact
    contact_name    bob
}

define contact {
    use             base-contact
    contact_name    cat
}

define contactgroup {
    contactgroup_name   cg-a
    members             amy
}

define contactgroup {
    contactgroup_name   cg-b
    members             bob
}

define contactgroup {
    contactgroup_name   cg-c
    members             cat
}

define contactgroup {
    contactgroup_name       cg-groups
    contactgroup_members    cg-a
    contactgroup_members    cg-c
}

define contactgroup {
    contactgroup_name       cg-mixed
    members                 amy
    contactgroup_members    cg-b
    members                 cat
    members                 amy
}

define hostgroup {
    hostgroup_name  hg-a
    members         alpha
}

define hostgroup {
    hostgroup_name  hg-b
    members         beta
}

define hostgroup {
    hostgroup_name  hg-c
    members         gamma
}

define hostgroup {
    hostgroup_name      hg-groups
    hostgroup_members   hg-a
    hostgroup_members   hg-c
}

define hostgroup {
    hostgroup_name      hg-excl
    members             alpha,beta,gamma
    members             !beta
}

define hostgroup {
    hostgroup_name      hg-star
    members             alpha
    members             *
    notes               one
    notes               two
}

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

define host {
    use             base-host
    host_name       beta
    address         192.0.2.2
}

define host {
    use             base-host
    host_name       gamma
    address         192.0.2.3
}

define service {
    use                     base-service
    host_name               alpha
    service_description     one
}

define service {
    use                     base-service
    host_name               beta
    service_description     two
}

define servicegroup {
    servicegroup_name   sg-a
    members             alpha,one
}

define servicegroup {
    servicegroup_name   sg-b
    members             beta,two
}

define servicegroup {
    servicegroup_name       sg-groups
    servicegroup_members    sg-a
    servicegroup_members    sg-b
}


# Every other list: the later line counts.

define contact {
    use             base-contact
    contact_name    dan
    contactgroups   cg-a
    contactgroups   cg-b
    host_notification_commands  check_dummy
    host_notification_commands  notify_dummy
}

define hostgroup {
    hostgroup_name  hg-d
}

define host {
    use             base-host
    host_name       delta
    address         192.0.2.4
    hostgroups      hg-a
    hostgroups      hg-d
    parents         alpha
    parents         gamma
    contacts        amy
    contacts        bob
    contact_groups  cg-a
    contact_groups  cg-c
}

define service {
    use                     base-service
    host_name               alpha
    host_name               delta
    service_description     three
    contacts                amy
    contacts                bob
    contact_groups          cg-a
    contact_groups          cg-c
    servicegroups           sg-a
    servicegroups           sg-b
}

define service {
    use                     base-service
    hostgroup_name          hg-a
    hostgroup_name          hg-c
    service_description     four
}

define hostescalation {
    host_name               alpha
    host_name               gamma
    contacts                amy
    contacts                bob
    first_notification      1
    last_notification       2
    notification_interval   5
}

define hostdependency {
    host_name                       alpha
    dependent_host_name             beta
    dependent_host_name             gamma
    notification_failure_criteria   d
}

define timeperiod {
    timeperiod_name     office
    alias               Office hours
    monday              09:00-17:00
    exclude             always
    exclude             lunch
}

define timeperiod {
    timeperiod_name     lunch
    alias               Lunch
    monday              12:00-13:00
}
