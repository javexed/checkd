# Objects that most cases need: two commands, one timeperiod, one contact,
# and a template per object type that fills in the required settings.

define command {
    command_name    check_dummy
    command_line    /usr/lib/checkd-test/check_dummy $ARG1$
}

define command {
    command_name    notify_dummy
    command_line    /usr/lib/checkd-test/notify_dummy
}

define timeperiod {
    timeperiod_name always
    alias           Every hour of every day
    monday          00:00-24:00
    tuesday         00:00-24:00
    wednesday       00:00-24:00
    thursday        00:00-24:00
    friday          00:00-24:00
    saturday        00:00-24:00
    sunday          00:00-24:00
}

define contact {
    name                            base-contact
    register                        0
    host_notification_period        always
    service_notification_period     always
    host_notification_options       d,u,r
    service_notification_options    w,u,c,r
    host_notification_commands      notify_dummy
    service_notification_commands   notify_dummy
}

define contact {
    use             base-contact
    contact_name    ops
}

define host {
    name                    base-host
    register                0
    check_command           check_dummy!0
    max_check_attempts      3
    check_period            always
    notification_period     always
    contacts                ops
}

define service {
    name                    base-service
    register                0
    check_command           check_dummy!0
    max_check_attempts      3
    check_period            always
    notification_period     always
    contacts                ops
}
