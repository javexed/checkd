# A host dependency with a name that is not defined. Naemon prints an
# error ("Could not find any host matching 'nosuch'"), drops the
# dependency and accepts the configuration. Anywhere else the same fault
# refuses it (`bad-servicedependency-partly-unknown`). checkd drops the
# dependency too and warns.

# The one dependency that is made.
define hostdependency {
    host_name                    alpha
    dependent_host_name          gamma
    execution_failure_options    d
}

define hostdependency {
    host_name                    nosuch
    dependent_host_name          gamma
    execution_failure_options    d
}

define hostdependency {
    host_name                    alpha
    dependent_host_name          nosuch
    execution_failure_options    d
}

# One name of two is not defined: nothing is made for the other one.
define hostdependency {
    host_name                    alpha,nosuch
    dependent_host_name          beta
    execution_failure_options    d
}

define hostdependency {
    hostgroup_name               nosuch
    dependent_host_name          gamma
    execution_failure_options    d
}

define hostdependency {
    hostgroup_name               web,nosuch
    dependent_host_name          beta
    execution_failure_options    d
}

define hostdependency {
    host_name                    alpha
    dependent_hostgroup_name     nosuch
    execution_failure_options    d
}

# A pattern, with `use_regexp_matching` off.
define hostdependency {
    host_name                    al.*
    dependent_host_name          gamma
    execution_failure_options    d
}
