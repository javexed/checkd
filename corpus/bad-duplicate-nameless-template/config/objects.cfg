# Two contacts with the same template name and no contact name. Both are
# templates (`templates-nameless`), and a template name can be used once.

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

define service {
    use                     base-service
    host_name               alpha
    service_description     ping
}

define contact {
    name            pager-defaults
    use             base-contact
}

define contact {
    name            pager-defaults
    use             base-contact
}
