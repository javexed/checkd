# The ways an extinfo definition names its hosts and services.

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.1
}

define host {
    use         base-host
    host_name   beta
    address     192.0.2.2
}

define host {
    use         base-host
    host_name   gamma
    address     192.0.2.3
    hostgroups  db
}

define hostgroup {
    hostgroup_name  web
    members         alpha,beta
}

define hostgroup {
    hostgroup_name  db
}

define hostgroup {
    hostgroup_name  mixed
    members         alpha,gamma
}

define service {
    use                     base-service
    host_name               alpha,beta
    service_description     ping
}

define service {
    use                     base-service
    host_name               alpha
    service_description     ssh
}

define hostextinfo {
    host_name   alpha,beta
    notes       list of hosts
}

define hostextinfo {
    hostgroup_name  web
    action_url      http://ext.example/web
}

# A group a host joined through its own "hostgroups".
define hostextinfo {
    hostgroup_name  db
    notes           db host
}

# Both a host and a group.
define hostextinfo {
    host_name       gamma
    hostgroup_name  web
    icon_image      everyone.png
}

# A group less one of its hosts.
define hostextinfo {
    hostgroup_name  web
    host_name       !alpha
    icon_image_alt  web but not alpha
}

# Every host.
define hostextinfo {
    host_name       *
    statusmap_image all.gd2
}

# With no group, the "!" entry is ignored: alpha gets the value too.
define hostextinfo {
    host_name       *,!alpha
    vrml_image      lone-exclusion.vrml
}

# Services: lists of hosts and of descriptions.
define serviceextinfo {
    host_name               alpha,beta
    service_description     ping
    notes                   ping on two hosts
}

define serviceextinfo {
    host_name               alpha
    service_description     ping,ssh
    notes_url               http://ext.example/alpha
}

define serviceextinfo {
    hostgroup_name          web
    service_description     ping
    action_url              http://ext.example/web-ping
}

define serviceextinfo {
    host_name               alpha
    service_description     *
    icon_image              all-on-alpha.png
}

define serviceextinfo {
    host_name               alpha
    service_description     *,!ssh
    icon_image_alt          all but ssh
}

# A group less one host. Here the "!" entry counts.
define service {
    use                     base-service
    hostgroup_name          mixed
    service_description     disk
}

define serviceextinfo {
    hostgroup_name          mixed
    host_name               !alpha
    service_description     disk
    notes                   disk, not on alpha
}

# For a serviceextinfo a "!" entry counts without a group too: gamma has
# no ping service, and this is accepted.
define serviceextinfo {
    host_name               *,!gamma
    service_description     ping
    icon_image_alt          ping where there is one
}

# Definitions that name nobody are read and do nothing.
define hostextinfo {
    notes       for nobody
}

define serviceextinfo {
    host_name   alpha
    notes       no description
}

define serviceextinfo {
    service_description     ping
    notes                   no host
}
