# `host_name null` on a service escalation is no host.

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

define host {
    use             base-host
    host_name       beta
    address         192.0.2.2
}

define hostgroup {
    hostgroup_name  web
    members         alpha,beta
}

define servicegroup {
    servicegroup_name   pings
}

define servicegroup {
    servicegroup_name   disks
}

define service {
    use                     base-service
    host_name               alpha,beta
    service_description     ping
    servicegroups           pings
}

define service {
    use                     base-service
    host_name               alpha,beta
    service_description     disk
    servicegroups           disks
}

# Only alpha has this one.
define service {
    use                     base-service
    host_name               alpha
    service_description     load
}

define serviceescalation {
    host_name              null
    service_description    ping
    contacts               ops
    first_notification     1
    last_notification      2
}
