# An option list given twice in one definition. For most option lists the
# lines are added together, and `n` on a line clears what came before it.
# For `flap_detection_options` the later line counts.

define contact {
    use             base-contact
    contact_name    amy
    host_notification_options       d
    host_notification_options       r
    service_notification_options    w
    service_notification_options    n
}

define contact {
    use             base-contact
    contact_name    bob
    service_notification_options    n
    service_notification_options    c
}

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
    notification_options    d
    notification_options    r
    flap_detection_options  o
    flap_detection_options  d
    stalking_options        o
    stalking_options        u
}

define host {
    use             base-host
    host_name       beta
    address         192.0.2.2
    notification_options    n
    notification_options    u
}

define host {
    use             base-host
    host_name       gamma
    address         192.0.2.3
    notification_options    u
    notification_options    n
}

# `a` on either line gives every option.
define host {
    use             base-host
    host_name       delta
    address         192.0.2.4
    notification_options    a
    notification_options    d
}

define host {
    use             base-host
    host_name       epsilon
    address         192.0.2.5
    notification_options    d
    notification_options    a
}

# `n` in the middle of one line clears what is to its left, and the next
# line adds to what is left.
define host {
    use             base-host
    host_name       zeta
    address         192.0.2.6
    notification_options    d,n
    notification_options    u
    stalking_options        o,n,u
}

define service {
    use                     base-service
    host_name               alpha
    service_description     one
    notification_options    w
    notification_options    c
    flap_detection_options  o
    flap_detection_options  w
    stalking_options        o
    stalking_options        c
}

define service {
    use                     base-service
    host_name               beta
    service_description     two
}

define hostescalation {
    host_name               alpha
    contacts                amy
    first_notification      1
    last_notification       2
    notification_interval   5
    escalation_options      d
    escalation_options      r
}

define serviceescalation {
    host_name               alpha
    service_description     one
    contacts                amy
    first_notification      1
    last_notification       2
    notification_interval   5
    escalation_options      w
    escalation_options      c
}

# The second line of notification_failure_criteria clears the first, so
# only the execution side of each dependency is left.
define hostdependency {
    host_name                       alpha
    dependent_host_name             beta
    execution_failure_criteria      d
    execution_failure_criteria      u
    notification_failure_criteria   u
    notification_failure_criteria   n
}

define hostdependency {
    host_name                       alpha
    dependent_host_name             gamma
    notification_failure_criteria   d
    notification_failure_options    u
}

define servicedependency {
    host_name                       alpha
    service_description             one
    dependent_host_name             beta
    dependent_service_description   two
    execution_failure_criteria      w
    execution_failure_criteria      c
    notification_failure_criteria   u
    notification_failure_criteria   n
}
