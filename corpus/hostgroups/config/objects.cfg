# Host group membership: listed in the group, listed on the host, through
# other groups, and with the "*" wildcard.

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.10
}

define host {
    use         base-host
    host_name   beta
    address     192.0.2.11
}

define host {
    use         base-host
    host_name   gamma
    address     192.0.2.12
}

define host {
    use         base-host
    host_name   delta
    address     192.0.2.13
}

define host {
    use         base-host
    host_name   epsilon
    address     192.0.2.14
    hostgroups  hg-by-host,hg-both-ways
}

define hostgroup {
    hostgroup_name  hg-web
    alias           Web servers
    members         beta,alpha
    notes           Front ends
    notes_url       https://example.test/groups/web
    action_url      https://example.test/groups/web/graph
}

define hostgroup {
    hostgroup_name  hg-db
    members         gamma
}

# Members come only from other groups.
define hostgroup {
    hostgroup_name  hg-servers
    hostgroup_members   hg-web,hg-db
}

# Own members and group members, two levels deep.
define hostgroup {
    hostgroup_name  hg-site
    members         delta
    hostgroup_members   hg-servers
}

define hostgroup {
    hostgroup_name  hg-everything
    members         *
}

# Members come only from the "hostgroups" setting of a host.
define hostgroup {
    hostgroup_name  hg-by-host
}

# Listed on both sides, and one host listed twice.
define hostgroup {
    hostgroup_name  hg-both-ways
    members         epsilon,alpha,alpha
}

# No members at all.
define hostgroup {
    hostgroup_name  hg-empty
    alias           Nobody
}

# Spaces around the commas.
define hostgroup {
    hostgroup_name  hg-spaced
    members         alpha , gamma,  delta
}
