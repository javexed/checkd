# What a `!` takes out when a service group is in play. It works on the
# whole result, not only on its own list:
#
# - `!group` takes out every member of that service group, also a service
#   that another group or the host and description lists brought in;
# - `!description` takes that service out on each host the definition
#   names, also where a service group brought it in;
# - an excluded host does not reach into the service groups.
#
# Each escalation has its own first_notification, and each dependency its
# own failure criteria, so the dump shows which one made an entry.

# A host with two services for the other side of the dependencies, a
# wide service group and a narrow one inside it.
define host {
    use          base-host
    host_name    delta
    address      192.0.2.4
}

define service {
    use                    base-service
    host_name              delta
    service_description    first
}

define service {
    use                    base-service
    host_name              delta
    service_description    last
}

define servicegroup {
    servicegroup_name    sg-wide
    members              alpha,ping,gamma,ping,gamma,load
}

define servicegroup {
    servicegroup_name    sg-narrow
    members              gamma,ping
}

# 1: alpha/ping and gamma/load. gamma/ping is in the excluded group.
define serviceescalation {
    servicegroup_name        sg-wide,!sg-narrow
    contacts                 ops
    first_notification       1
    last_notification        9
    notification_interval    5
}

# 2: the same, though gamma/ping is also named by host and description.
define serviceescalation {
    servicegroup_name        sg-wide,!sg-narrow
    host_name                gamma
    service_description      ping
    contacts                 ops
    first_notification       2
    last_notification        9
    notification_interval    5
}

# 3: gamma/load only. The excluded group takes gamma/ping out of the
# services of gamma.
define serviceescalation {
    servicegroup_name        !sg-narrow
    host_name                gamma
    service_description      *
    contacts                 ops
    first_notification       3
    last_notification        9
    notification_interval    5
}

# 4: alpha/ping and gamma/load. The excluded description takes gamma/ping
# out of the group, and leaves alpha/ping, as alpha is not named.
define serviceescalation {
    servicegroup_name        sg-wide
    host_name                gamma
    service_description      *,!ping
    contacts                 ops
    first_notification       4
    last_notification        9
    notification_interval    5
}

# 5: all three of the group, and alpha/load and beta/load. The excluded
# host stays in the group.
define serviceescalation {
    servicegroup_name        sg-wide
    host_name                alpha,beta,!gamma
    service_description      load
    contacts                 ops
    first_notification       5
    last_notification        9
    notification_interval    5
}

# w: the master side of a dependency, as 1.
define servicedependency {
    servicegroup_name                sg-wide,!sg-narrow
    dependent_host_name              delta
    dependent_service_description    last
    execution_failure_options        w
}

# u: the dependent side, as 1.
define servicedependency {
    dependent_servicegroup_name    sg-wide,!sg-narrow
    host_name                      delta
    service_description            first
    execution_failure_options      u
}

# c: as 4.
define servicedependency {
    servicegroup_name                sg-wide
    host_name                        gamma
    service_description              *,!ping
    dependent_host_name              delta
    dependent_service_description    last
    execution_failure_options        c
}

# o: nothing is left, and for a dependency that is accepted.
define servicedependency {
    servicegroup_name                sg-narrow,!sg-wide
    dependent_host_name              delta
    dependent_service_description    last
    execution_failure_options        o
}
