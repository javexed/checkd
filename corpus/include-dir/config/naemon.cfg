# include_dir reads the files of a directory whose names end in .cfg, as
# files of main config settings. It does not look into directories below,
# and it skips names that start with a dot and names that end in anything
# but .cfg in small letters. Each skipped file here sets
# service_check_timeout, so services keep 33 when none of them is read.
#
# The directory is given twice, once with a slash at the end. Reading it
# twice changes nothing.
#
# The two files that are read set different things. With the same setting
# in both, the result would hang on the order: Naemon reads the files in
# the order the file system gives them, and checkd sorts them by name.

cfg_file=common.cfg
cfg_file=objects.cfg
host_check_timeout=11
service_check_timeout=33
include_dir=conf/
include_dir=conf
