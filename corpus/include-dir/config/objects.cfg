define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

define host {
    use             base-host
    host_name       beta
    address         192.0.2.2
}

define service {
    use                    base-service
    host_name              alpha
    service_description    Ping
}

# The pattern works because use_regexp_matching is set in conf/matching.cfg.
define hostgroup {
    hostgroup_name    by-pattern
    members           al.*
}
