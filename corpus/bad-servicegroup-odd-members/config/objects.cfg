# A service group member list with a host and no service after it.

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.10
}

define service {
    use                     base-service
    host_name               alpha
    service_description     Ping
}

define servicegroup {
    servicegroup_name   sg-web
    members             alpha,Ping,alpha
}
