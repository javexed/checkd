# The same service defined twice for the same host, both by host name.
# Naemon keeps the later one and warns. checkd refuses it.

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.10
}

define service {
    use                     base-service
    host_name               alpha
    service_description     Ping
    check_interval          1
}

define service {
    use                     base-service
    host_name               alpha
    service_description     Ping
    check_interval          10
}

