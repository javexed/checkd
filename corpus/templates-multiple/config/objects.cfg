# Several templates in one "use". The docs say the first one listed wins a
# conflict, and give no rule for nested chains. The hosts below ask the
# oracle about the nested cases.

define host {
    name                    t-first
    register                0
    check_interval          7
    notes                   set in t-first
}

define host {
    name                    t-second
    register                0
    check_interval          9
    retry_interval          4
    notes                   set in t-second
    notes_url               https://example.test/second
}

# t-deep is reached only through t-first-child.
define host {
    name                    t-deep
    register                0
    retry_interval          6
    notes_url               https://example.test/deep
    action_url              https://example.test/deep-action
}

define host {
    name                    t-first-child
    use                     t-deep
    register                0
    check_interval          8
}

# First listed wins: check_interval 7. retry_interval comes from t-second.
define host {
    use                     t-first,t-second,base-host
    host_name               alpha
    address                 192.0.2.10
}

# Same templates, other order: check_interval 9.
define host {
    use                     t-second,t-first,base-host
    host_name               beta
    address                 192.0.2.11
}

# retry_interval is set in t-deep (parent of the first template) and in
# t-second (the second template). Which one wins?
define host {
    use                     t-first-child,t-second,base-host
    host_name               gamma
    address                 192.0.2.12
}

# The same question with the order reversed.
define host {
    use                     t-second,t-first-child,base-host
    host_name               delta
    address                 192.0.2.13
}

# Spaces after the commas in "use".
define host {
    use                     t-first, t-second, base-host
    host_name               epsilon
    address                 192.0.2.14
}

# The same template reached twice, directly and through t-first-child.
define host {
    use                     t-deep,t-first-child,base-host
    host_name               zeta
    address                 192.0.2.15
}
