# Host and service dependencies, written with lists, groups and wildcards.

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.10
}

define host {
    use         base-host
    host_name   beta
    address     192.0.2.11
}

define host {
    use         base-host
    host_name   gamma
    address     192.0.2.12
}

define host {
    use         base-host
    host_name   delta
    address     192.0.2.13
}

define service {
    use                     base-service
    host_name               alpha,beta,gamma,delta
    service_description     Ping
}

define service {
    use                     base-service
    host_name               alpha,beta,gamma,delta
    service_description     Load
}

define service {
    use                     base-service
    host_name               alpha,beta
    service_description     Http
}

define hostgroup {
    hostgroup_name  hg-web
    members         alpha,beta
}

define hostgroup {
    hostgroup_name  hg-db
    members         gamma,delta
}

define servicegroup {
    servicegroup_name   sg-ping
    members             alpha,Ping,beta,Ping
}

define servicegroup {
    servicegroup_name   sg-http
    members             alpha,Http,beta,Http
}

# One host, two dependents, every setting given.
define hostdependency {
    host_name                       alpha
    dependent_host_name             beta,gamma
    inherits_parent                 1
    execution_failure_criteria      d,u
    notification_failure_criteria   d,u,p
    dependency_period               always
}

# Groups on both sides, nothing else set.
define hostdependency {
    hostgroup_name                  hg-db
    dependent_hostgroup_name        hg-web
}

# Only one kind of criteria.
define hostdependency {
    host_name                       gamma
    dependent_host_name             delta
    notification_failure_criteria   d
}

# One service, two dependent services on another host.
define servicedependency {
    host_name                       alpha
    service_description             Ping
    dependent_host_name             beta
    dependent_service_description   Ping,Load
    inherits_parent                 1
    execution_failure_criteria      w,u,c
    notification_failure_criteria   c,p
    dependency_period               always
}

# Same host: no dependent host is named, so Load depends on Ping on each
# of the two hosts.
define servicedependency {
    host_name                       gamma,delta
    service_description             Ping
    dependent_service_description   Load
    notification_failure_criteria   w,u,c
}

# Service groups on both sides.
define servicedependency {
    servicegroup_name               sg-ping
    dependent_servicegroup_name     sg-http
    execution_failure_criteria      c
}

# Every service on one host depends on every service on another.
define servicedependency {
    host_name                       gamma
    service_description             *
    dependent_host_name             delta
    dependent_service_description   *
    notification_failure_criteria   u
}

# Host groups on both sides.
define servicedependency {
    hostgroup_name                  hg-db
    service_description             Ping
    dependent_hostgroup_name        hg-web
    dependent_service_description   Http
    execution_failure_criteria      u
}

# "o" and "n" as criteria.
define servicedependency {
    host_name                       alpha
    service_description             Load
    dependent_host_name             alpha
    dependent_service_description   Http
    execution_failure_criteria      o
    notification_failure_criteria   n
}
