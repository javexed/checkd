# `*` alone stands for every name when `use_regexp_matching` is off, in
# the lists below. With it on, see `bad-regexp-star-host` and the cases
# beside it.

# Every host.
define service {
    use                    base-service
    host_name              *
    service_description    on-every-host
}

# Every host of every host group.
define service {
    use                    base-service
    hostgroup_name         *
    service_description    in-every-group
}

define service {
    use                    base-service
    host_name              *,!beta
    service_description    not-on-beta
}

define service {
    use                    base-service
    hostgroup_name         *,!db
    service_description    not-in-db
}

# A host that joins every host group, and one that joins all but one.
define host {
    use           base-host
    host_name     delta
    address       192.0.2.4
    hostgroups    *
}

define host {
    use           base-host
    host_name     epsilon
    address       192.0.2.5
    hostgroups    *,!db
}

# The two new hosts get the services the other hosts have.
define service {
    use                    base-service
    host_name              delta,epsilon
    service_description    ping
}

define service {
    use                    base-service
    host_name              delta,epsilon
    service_description    load
}

# The same for a service and its service groups.
define service {
    use                    base-service
    host_name              gamma
    service_description    joins-all
    servicegroups          *
}

define service {
    use                    base-service
    host_name              gamma
    service_description    joins-all-but-one
    servicegroups          *,!sg-load
}

# And for a contact and its contact groups.
define contact {
    use              base-contact
    contact_name     third
    contactgroups    *
}

define contact {
    use              base-contact
    contact_name     fourth
    contactgroups    *,!cg-night
}

# Members of groups.
define hostgroup {
    hostgroup_name    every-host
    members           *
}

define hostgroup {
    hostgroup_name    all-but-beta
    members           *,!beta
}

define contactgroup {
    contactgroup_name    everyone
    members              *
}

define contactgroup {
    contactgroup_name    all-but-second
    members              *,!second
}

# Escalations. In a list of hosts with no host group beside it the
# exclusion is not applied (`escalation-exclusions`).
define hostescalation {
    host_name                *
    contacts                 ops
    first_notification       1
    last_notification        2
    notification_interval    5
}

define hostescalation {
    hostgroup_name           *,!db
    escalation_options       d
    contacts                 ops
    first_notification       1
    last_notification        2
    notification_interval    5
}

define serviceescalation {
    host_name                *
    service_description      ping
    contacts                 ops
    first_notification       1
    last_notification        2
    notification_interval    5
}

define serviceescalation {
    hostgroup_name           *,!db
    service_description      load
    contacts                 ops
    first_notification       1
    last_notification        2
    notification_interval    5
}

define serviceescalation {
    servicegroup_name        *
    escalation_options       w
    contacts                 ops
    first_notification       1
    last_notification        2
    notification_interval    5
}

define serviceescalation {
    servicegroup_name        *,!sg-load
    escalation_options       c
    contacts                 ops
    first_notification       1
    last_notification        2
    notification_interval    5
}

define serviceescalation {
    host_name                alpha
    service_description      *
    escalation_options       u
    contacts                 ops
    first_notification       1
    last_notification        2
    notification_interval    5
}

define serviceescalation {
    host_name                beta
    service_description      *,!load
    escalation_options       r
    contacts                 ops
    first_notification       1
    last_notification        2
    notification_interval    5
}

# Service dependencies: `load` on `ping` on every host, and one service
# on every member of every service group.
define servicedependency {
    host_name                        *
    service_description              ping
    dependent_service_description    load
    execution_failure_options        c
}

define service {
    use                    base-service
    host_name              gamma
    service_description    last
}

define servicedependency {
    servicegroup_name                *
    dependent_host_name              gamma
    dependent_service_description    last
    execution_failure_options        c
}

# Extended info.
define hostextinfo {
    host_name    *
    notes        For every host
}

define serviceextinfo {
    hostgroup_name         *,!db
    service_description    ping
    notes                  For ping outside db
}

define serviceextinfo {
    host_name              gamma
    service_description    *
    notes_url              http://192.0.2.80/gamma
}
