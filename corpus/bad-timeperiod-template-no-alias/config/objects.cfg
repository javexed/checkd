# A timeperiod with a name and no alias. A template name does not make it
# a template: only a missing `timeperiod_name` does (`templates-nameless`).

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

define service {
    use                     base-service
    host_name               alpha
    service_description     ping
}

define timeperiod {
    name            alias-comes-later
    timeperiod_name no-alias
}
