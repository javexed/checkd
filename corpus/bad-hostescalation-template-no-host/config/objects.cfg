# A host escalation that names no host. Unlike a host or a service, it is
# not taken for a template because it has a template name.

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

define service {
    use                     base-service
    host_name               alpha
    service_description     ping
}

define hostescalation {
    name                    escalation-defaults
    contacts                ops
    first_notification      1
    last_notification       2
}
