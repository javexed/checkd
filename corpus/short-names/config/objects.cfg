# Older and shorter names of settings that Naemon still reads. Each one
# stands for the setting named in the comment beside it.

define host {
    use                     base-host
    host_name               alpha
    address                 192.0.2.1
    normal_check_interval   7       ; check_interval
    retry_check_interval    3       ; retry_interval
    obsess_over_host        0       ; obsess
    checks_enabled          0       ; active_checks_enabled
}

define host {
    use                     base-host
    host_name               beta
    address                 192.0.2.2
}

define host {
    use                     base-host
    host_name               gamma
    address                 192.0.2.3
}

define host {
    use                     base-host
    host_name               delta
    address                 192.0.2.4
}

define hostgroup {
    hostgroup_name          web
    members                 alpha,beta
}

define hostgroup {
    hostgroup_name          db
    members                 gamma,delta
}

define service {
    use                     base-service
    host                    alpha   ; host_name
    service_description     by-host
    normal_check_interval   7       ; check_interval
    retry_check_interval    3       ; retry_interval
    obsess_over_service     0       ; obsess
}

define service {
    use                     base-service
    hosts                   alpha,beta      ; host_name
    service_description     by-hosts
}

define service {
    use                     base-service
    hostgroup               web     ; hostgroup_name
    service_description     by-hostgroup
}

define service {
    use                     base-service
    hostgroups              web     ; hostgroup_name
    service_description     by-hostgroups
}

define hostescalation {
    host                    alpha   ; host_name
    contacts                ops
    first_notification      1
    last_notification       2
    notification_interval   10
}

define hostescalation {
    hostgroup               web     ; hostgroup_name
    contacts                ops
    first_notification      3
    last_notification       4
    notification_interval   20
}

define hostescalation {
    hostgroups              web     ; hostgroup_name
    contacts                ops
    first_notification      5
    last_notification       6
    notification_interval   30
}

define serviceescalation {
    host                    alpha   ; host_name
    service_description     by-host
    contacts                ops
    first_notification      1
    last_notification       2
    notification_interval   10
}

define serviceescalation {
    hostgroup               web     ; hostgroup_name
    service_description     by-hosts
    contacts                ops
    first_notification      3
    last_notification       4
    notification_interval   20
}

define serviceescalation {
    hostgroups              web     ; hostgroup_name
    service_description     by-hostgroup
    contacts                ops
    first_notification      5
    last_notification       6
    notification_interval   30
}

define hostdependency {
    host                            alpha   ; host_name
    dependent_host                  beta    ; dependent_host_name
    execution_failure_criteria      d       ; execution_failure_options
    notification_failure_criteria   u       ; notification_failure_options
}

define hostdependency {
    hostgroup                       web     ; hostgroup_name
    dependent_hostgroup             db      ; dependent_hostgroup_name
    execution_failure_options       u
}

define hostdependency {
    hostgroups                      web     ; hostgroup_name
    dependent_hostgroups            db      ; dependent_hostgroup_name
    notification_failure_options    d
}

define servicedependency {
    host                            alpha   ; host_name
    service_description             by-host
    dependent_host                  beta    ; dependent_host_name
    dependent_service_description   by-hosts
    execution_failure_criteria      w       ; execution_failure_options
    notification_failure_criteria   c       ; notification_failure_options
}

define servicedependency {
    hostgroup                       web     ; hostgroup_name
    service_description             by-hosts
    dependent_hostgroup             web     ; dependent_hostgroup_name
    dependent_service_description   by-hostgroup
    execution_failure_options       u
}

define servicedependency {
    hostgroups                      web     ; hostgroup_name
    service_description             by-hostgroup
    dependent_hostgroups            web     ; dependent_hostgroup_name
    dependent_service_description   by-hostgroups
    execution_failure_options       c
}

define hostextinfo {
    hostgroup               web     ; hostgroup_name
    notes                   From hostextinfo
}

define serviceextinfo {
    hostgroup               web     ; hostgroup_name
    service_description     by-hosts
    notes                   From serviceextinfo
}
