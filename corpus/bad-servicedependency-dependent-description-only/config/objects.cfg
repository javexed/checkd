# A service dependency that gives a dependent description and nothing
# else. With a dependent host it would be accepted
# (`servicedependency-sides`).

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

define host {
    use             base-host
    host_name       beta
    address         192.0.2.2
}

define hostgroup {
    hostgroup_name  web
    members         alpha,beta
}

define servicegroup {
    servicegroup_name   pings
}

define servicegroup {
    servicegroup_name   disks
}

define service {
    use                     base-service
    host_name               alpha,beta
    service_description     ping
    servicegroups           pings
}

define service {
    use                     base-service
    host_name               alpha,beta
    service_description     disk
    servicegroups           disks
}

# Only alpha has this one.
define service {
    use                     base-service
    host_name               alpha
    service_description     load
}

define servicedependency {
    dependent_service_description    disk
    notification_failure_criteria    c
}
