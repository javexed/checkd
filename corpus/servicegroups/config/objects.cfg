# Service group membership: host and service pairs in the group, the
# "servicegroups" setting of a service, and groups inside groups.

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.10
}

define host {
    use         base-host
    host_name   beta
    address     192.0.2.11
}

define service {
    use                     base-service
    host_name               alpha,beta
    service_description     Http
}

define service {
    use                     base-service
    host_name               alpha,beta
    service_description     Disk space
}

define service {
    use                     base-service
    host_name               alpha
    service_description     Database
    servicegroups           sg-db,sg-both-ways
}

define servicegroup {
    servicegroup_name   sg-web
    alias               Web services
    members             beta,Http,alpha,Http
    notes               Front ends
    notes_url           https://example.test/groups/web
    action_url          https://example.test/groups/web/graph
}

# Members come only from the "servicegroups" setting of a service.
define servicegroup {
    servicegroup_name   sg-db
}

define servicegroup {
    servicegroup_name   sg-disk
    members             alpha,Disk space, beta,Disk space
}

define servicegroup {
    servicegroup_name   sg-all
    servicegroup_members    sg-web,sg-db
    members             alpha,Disk space
}

define servicegroup {
    servicegroup_name   sg-top
    servicegroup_members    sg-all
}

define servicegroup {
    servicegroup_name   sg-both-ways
    members             alpha,Database,alpha,Http
}

define servicegroup {
    servicegroup_name   sg-empty
}
