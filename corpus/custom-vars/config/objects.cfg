# Custom variables: names start with "_". They are inherited like other
# values and can be overridden or cancelled.

define host {
    name                    racked-host
    use                     base-host
    register                0
    _RACK                   r1
    _OWNER                  team-a
    _snmp_community         public
}

define host {
    use                     racked-host
    host_name               alpha
    address                 192.0.2.10
    _RACK                   r2
    _Location               Room 5, second floor
    _URL                    https://example.test/hosts?name=alpha&view=full
}

define host {
    use                     racked-host
    host_name               beta
    address                 192.0.2.11
    _OWNER                  null
}

# "+" on a custom variable. The docs say additive inheritance is for
# standard variables only.
define host {
    use                     racked-host
    host_name               gamma
    address                 192.0.2.12
    _OWNER                  +team-b
}

# The same name in two letter cases, and a name that is only "_".
define host {
    use                     base-host
    host_name               delta
    address                 192.0.2.13
    _Mixed                  lower then upper
    _MIXED                  upper
    __DOUBLE                two underscores
}

define service {
    name                    sla-service
    use                     base-service
    register                0
    _SLA                    gold
    _ESCALATE_AFTER         15
}

define service {
    use                     sla-service
    host_name               alpha
    service_description     Api
    _SLA                    silver
}

define contact {
    use             base-contact
    contact_name    dev
    _CHAT_HANDLE    @dev
    _shift          night
}
