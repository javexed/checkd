# Two parent services on the same host, written as two descriptions. Are
# they read as two descriptions, or as one pair of host and description?

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.10
}

define host {
    use         base-host
    host_name   beta
    address     192.0.2.11
}

define host {
    use         base-host
    host_name   gamma
    address     192.0.2.12
}

define service {
    use                     base-service
    host_name               alpha,beta,gamma
    service_description     Ping
}

define service {
    use                     base-service
    host_name               alpha,beta
    service_description     Load
}

define hostgroup {
    hostgroup_name  hg-all
    members         alpha,beta,gamma
}

define hostgroup {
    hostgroup_name  hg-ab
    members         alpha,beta
}

define service {
    use                     base-service
    host_name               alpha
    service_description     Web
    parents                 Ping,Load
}
