# A service escalation whose service group list leaves no service: the
# members of the first group are all in the excluded one
# (`servicegroup-exclusions`).

define servicegroup {
    servicegroup_name    sg-wide
    members              alpha,ping,beta,load
}

define serviceescalation {
    servicegroup_name        sg-ping,!sg-wide
    contacts                 ops
    first_notification       1
    last_notification        2
    notification_interval    5
}
