# The docs describe a "!" in front of a service template's check_command:
# the template's command then replaces the one the service sets itself.

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.10
}

define service {
    name                    forced-command
    use                     base-service
    register                0
    check_command           !check_dummy!3
}

define service {
    name                    normal-command
    use                     base-service
    register                0
    check_command           check_dummy!4
}

# Sets its own command, and the template forces another.
define service {
    use                     forced-command
    host_name               alpha
    service_description     Forced
    check_command           check_dummy!1
}

# Sets no command of its own.
define service {
    use                     forced-command
    host_name               alpha
    service_description     Forced without own
}

# The usual rule for comparison: the local value wins.
define service {
    use                     normal-command
    host_name               alpha
    service_description     Normal
    check_command           check_dummy!1
}

# The forcing template is second in the list.
define service {
    use                     normal-command,forced-command
    host_name               alpha
    service_description     Forced listed second
    check_command           check_dummy!1
}
