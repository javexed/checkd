# The older hostextinfo and serviceextinfo definitions.

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.10
}

define service {
    use                     base-service
    host_name               alpha
    service_description     Ping
}

define hostextinfo {
    host_name   alpha
    notes       From hostextinfo
}

define serviceextinfo {
    host_name               alpha
    service_description     Ping
    notes                   From serviceextinfo
}
