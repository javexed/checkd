# Exceptions that a timeperiod takes from its templates, several of each
# kind, to show the order they come out in.

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.10
}

define timeperiod {
    name                holidays
    timeperiod_name     holidays
    alias               Holidays
    january 1           00:00-24:00
    july 4              00:00-24:00
    december 25         00:00-24:00
    monday -1 may       00:00-24:00
    monday 1 september  00:00-24:00
    thursday 4 november 00:00-24:00
    2027-01-05          00:00-24:00
    2027-03-07          00:00-24:00
    2027-09-09          00:00-24:00
    day 1               00:00-24:00
    day 15              00:00-24:00
    day -1              00:00-24:00
    monday 2            00:00-24:00
    friday 3            00:00-24:00
    sunday -1           00:00-24:00
}

# Takes everything from the template and adds nothing.
define timeperiod {
    use                 holidays
    timeperiod_name     only-inherited
    alias               Only inherited
    monday              09:00-17:00
}

# Its own exceptions first in the file, among the template's kinds.
define timeperiod {
    use                 holidays
    name                more-holidays
    timeperiod_name     own-and-inherited
    alias               Own and inherited
    february 2          00:00-24:00
    march 3             00:00-24:00
    day 20              00:00-24:00
    day 10              00:00-24:00
    # The same day as in the template, with other times.
    july 4              09:00-17:00
}

# Two levels of templates.
define timeperiod {
    use                 more-holidays
    timeperiod_name     two-levels
    alias               Two levels
    april 4             00:00-24:00
}

define timeperiod {
    name                spring
    alias               Spring
    register            0
    march 20            00:00-24:00
    april 20            00:00-24:00
    may 20              00:00-24:00
}

define timeperiod {
    name                autumn
    alias               Autumn
    register            0
    september 20        00:00-24:00
    october 20          00:00-24:00
    november 20         00:00-24:00
}

# Two templates in one use.
define timeperiod {
    use                 spring,autumn
    timeperiod_name     two-templates
    alias               Two templates
    june 20             00:00-24:00
}
