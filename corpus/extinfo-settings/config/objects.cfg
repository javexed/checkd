# Every setting a hostextinfo and a serviceextinfo take.

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.1
}

define host {
    use         base-host
    host_name   beta
    address     192.0.2.2
}

define host {
    use         base-host
    host_name   gamma
    address     192.0.2.3
    hostgroups  db
}

define hostgroup {
    hostgroup_name  web
    members         alpha,beta
}

define hostgroup {
    hostgroup_name  db
}

define hostgroup {
    hostgroup_name  mixed
    members         alpha,gamma
}

define service {
    use                     base-service
    host_name               alpha,beta
    service_description     ping
}

define service {
    use                     base-service
    host_name               alpha
    service_description     ssh
}

define hostextinfo {
    host_name           alpha
    notes               ext notes
    notes_url           http://ext.example/notes
    action_url          http://ext.example/action
    icon_image          ext.png
    icon_image_alt      ext alt
    vrml_image          ext.vrml
    statusmap_image     ext.gd2
    2d_coords           10,20
    3d_coords           1.0,2.0,3.0
}

define serviceextinfo {
    host_name               alpha
    service_description     ping
    notes                   service ext notes
    notes_url               http://ext.example/service-notes
    action_url              http://ext.example/service-action
    icon_image              service-ext.png
    icon_image_alt          service ext alt
}

# "hostgroup" is taken for hostgroup_name.
define hostextinfo {
    hostgroup       db
    icon_image      db.png
}

define serviceextinfo {
    hostgroup               web
    service_description     ping
    icon_image_alt          web ping
}
