# host_check_timeout and service_check_timeout in the main config. Do they
# show as the check_timeout of a host or service that sets none?

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.10
}

define host {
    use             base-host
    host_name       beta
    address         192.0.2.11
    check_timeout   7
}

define service {
    use                     base-service
    host_name               alpha
    service_description     Ping
}

define service {
    use                     base-service
    host_name               beta
    service_description     Ping
    check_timeout           9
}
