# A host escalation is made once each time its lists bring a host up, so a
# host in two of the named groups gets the escalation twice. Service
# escalations, dependencies and services are made once however often the
# lists name them. Naemon says nothing; checkd warns.
#
# Each escalation has its own first_notification, so the dump shows which
# one made an entry.

# Two more host groups with alpha in them.
define hostgroup {
    hostgroup_name    both
    members           alpha,beta
}

define hostgroup {
    hostgroup_name    also
    members           alpha
}

# 1: alpha twice, once for each group.
define hostescalation {
    hostgroup_name           web,also
    contacts                 ops
    first_notification       1
    last_notification        9
    notification_interval    5
}

# 2: alpha twice, by group and by name.
define hostescalation {
    hostgroup_name           web
    host_name                alpha
    contacts                 ops
    first_notification       2
    last_notification        9
    notification_interval    5
}

# 3: alpha twice.
define hostescalation {
    host_name                alpha,alpha
    contacts                 ops
    first_notification       3
    last_notification        9
    notification_interval    5
}

# 4: alpha twice.
define hostescalation {
    hostgroup_name           web,web
    contacts                 ops
    first_notification       4
    last_notification        9
    notification_interval    5
}

# 5: alpha three times and beta twice: every group they are in.
define hostescalation {
    hostgroup_name           *
    contacts                 ops
    first_notification       5
    last_notification        9
    notification_interval    5
}

# 6: alpha twice, and the other hosts once.
define hostescalation {
    host_name                *,alpha
    contacts                 ops
    first_notification       6
    last_notification        9
    notification_interval    5
}

# 7: alpha twice. beta is taken out with its group.
define hostescalation {
    hostgroup_name           web,both,!db
    contacts                 ops
    first_notification       7
    last_notification        9
    notification_interval    5
}

# A service escalation and a host dependency for the same lists: one each.
define serviceescalation {
    hostgroup_name           web,also
    service_description      ping
    contacts                 ops
    first_notification       8
    last_notification        9
    notification_interval    5
}

define hostdependency {
    hostgroup_name               web,also
    host_name                    alpha
    dependent_host_name          gamma
    execution_failure_options    d
}
