# Definitions with a template `name`, without the setting that names the
# object, and without `register 0`. Naemon takes each one for a template
# and makes no object of it. It says nothing.

define host {
    name            web-defaults
    use             base-host
    notes           From web-defaults
    _ROLE           web
}

define host {
    use             web-defaults
    host_name       alpha
    address         192.0.2.1
}

# A service needs a description and hosts. With one of the two missing,
# or with `host_name null`, it is a template.
define service {
    name                    no-hosts
    use                     base-service
    service_description     From no-hosts
}

define service {
    name                    no-description
    use                     base-service
    host_name               alpha
}

define service {
    name                    null-hosts
    use                     base-service
    host_name               null
    service_description     From null-hosts
}

define service {
    name                    only-a-name
    action_url              https://example.invalid/action
}

define service {
    use                     no-hosts
    host_name               alpha
}

define service {
    use                     no-description
    service_description     Uses no-description
}

define service {
    use                     only-a-name,base-service
    host_name               alpha
    service_description     Uses only-a-name
}

define contact {
    name            pager-defaults
    use             base-contact
    pager           555-0100
}

define contact {
    use             pager-defaults
    contact_name    amy
}

define contactgroup {
    name            cg-defaults
    alias           From cg-defaults
}

define contactgroup {
    use                 cg-defaults
    contactgroup_name   admins
    members             amy
}

define hostgroup {
    name            hg-defaults
    alias           From hg-defaults
    notes           From hg-defaults
}

define hostgroup {
    use             hg-defaults
    hostgroup_name  web
    members         alpha
}

define servicegroup {
    name            sg-defaults
    alias           From sg-defaults
}

define servicegroup {
    use                 sg-defaults
    servicegroup_name   checks
    members             alpha,From no-hosts
}

define timeperiod {
    name            tp-defaults
    alias           From tp-defaults
    monday          09:00-17:00
}

define timeperiod {
    use             tp-defaults
    timeperiod_name office
    tuesday         09:00-17:00
}

define command {
    name            cmd-defaults
    command_line    /bin/true
}

define command {
    use             cmd-defaults
    command_name    check_true
}

# A host dependency with a template name and no hosts.
define hostdependency {
    name                            dep-defaults
    notification_failure_criteria   d
}
