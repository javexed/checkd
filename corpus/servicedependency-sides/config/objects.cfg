# The ways a service dependency can say which services it is about. Each
# side takes hosts (or host groups) with a description, a service group,
# or both. A side that gives a description and nothing else means "on the
# same host as the service on the other side".

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

define host {
    use             base-host
    host_name       beta
    address         192.0.2.2
}

define hostgroup {
    hostgroup_name  web
    members         alpha,beta
}

define servicegroup {
    servicegroup_name   pings
}

define servicegroup {
    servicegroup_name   disks
}

define service {
    use                     base-service
    host_name               alpha,beta
    service_description     ping
    servicegroups           pings
}

define service {
    use                     base-service
    host_name               alpha,beta
    service_description     disk
    servicegroups           disks
}

# Only alpha has this one.
define service {
    use                     base-service
    host_name               alpha
    service_description     load
}

# Both sides in full: every service of the one with every service of the other.
define servicedependency {
    host_name                        alpha
    service_description              ping
    dependent_hostgroup_name         web
    dependent_service_description    disk
    notification_failure_criteria    c
}

# Two descriptions on the dependent side.
define servicedependency {
    host_name                        alpha
    service_description              load
    dependent_host_name              beta
    dependent_service_description    disk,ping
    notification_failure_criteria    c
}

# Service groups on both sides.
define servicedependency {
    servicegroup_name                pings
    dependent_servicegroup_name      disks
    execution_failure_criteria       c
    notification_failure_criteria    c
}

# A service and a dependent service group.
define servicedependency {
    host_name                        alpha
    service_description              load
    dependent_servicegroup_name      disks
    execution_failure_criteria       w
    notification_failure_criteria    c
}

# Only a description on the dependent side: the same host as each service
# depended on.
define servicedependency {
    host_name                        alpha,beta
    service_description              ping
    dependent_service_description    disk
    execution_failure_criteria       u
    notification_failure_criteria    c
}

# The same with a host group.
define servicedependency {
    hostgroup_name                   web
    service_description              ping
    dependent_service_description    disk
    notification_failure_criteria    c
}

# The same with a service group.
define servicedependency {
    servicegroup_name                pings
    dependent_service_description    disk
    execution_failure_criteria       w,u
    notification_failure_criteria    c
}

# The same with a service group and a service.
define servicedependency {
    servicegroup_name                pings
    host_name                        alpha
    service_description              load
    dependent_service_description    disk
    execution_failure_criteria       p
    notification_failure_criteria    c
}

# `dependent_host_name null` is the same as leaving it out.
define servicedependency {
    host_name                        alpha
    service_description              load
    dependent_host_name              null
    dependent_service_description    ping
    execution_failure_criteria       c
    notification_failure_criteria    c
}

# Only a description on the other side: the same host as each dependent
# service.
define servicedependency {
    service_description              ping
    dependent_host_name              alpha,beta
    dependent_service_description    disk
    execution_failure_criteria       w,c
    notification_failure_criteria    c
}

# The same with a dependent service group.
define servicedependency {
    service_description              ping
    dependent_servicegroup_name      disks
    execution_failure_criteria       u,c
    notification_failure_criteria    c
}

# Nothing to depend on: accepted, and no dependency comes of it.
define servicedependency {
    dependent_host_name              alpha
    dependent_service_description    ping
    notification_failure_criteria    c
}

# The same with a dependent service group.
define servicedependency {
    dependent_servicegroup_name      disks
    notification_failure_criteria    c
}
