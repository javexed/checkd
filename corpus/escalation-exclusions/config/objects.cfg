# Does "!" take a host or a service out of an escalation? Each escalation
# has its own first_notification, so the dump shows which one made an entry.

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.10
}

define host {
    use         base-host
    host_name   beta
    address     192.0.2.11
}

define host {
    use         base-host
    host_name   gamma
    address     192.0.2.12
}

define service {
    use                     base-service
    host_name               alpha,beta,gamma
    service_description     Ping
}

define service {
    use                     base-service
    host_name               alpha,beta
    service_description     Load
}

define hostgroup {
    hostgroup_name  hg-all
    members         alpha,beta,gamma
}

define hostgroup {
    hostgroup_name  hg-ab
    members         alpha,beta
}

# 1: "!" in the host list of a host escalation, no host group.
define hostescalation {
    host_name               alpha,beta,gamma,!beta
    contacts                ops
    first_notification      1
    last_notification       1
}

# 2: the same with "*".
define hostescalation {
    host_name               *,!beta
    contacts                ops
    first_notification      2
    last_notification       2
}

# 3: "!" for a host that the list does not name.
define hostescalation {
    host_name               alpha,!beta
    contacts                ops
    first_notification      3
    last_notification       3
}

# 4: a host group, and "!" in the host list.
define hostescalation {
    hostgroup_name          hg-all
    host_name               !beta
    contacts                ops
    first_notification      4
    last_notification       4
}

# 5: "!" in the host group list.
define hostescalation {
    hostgroup_name          hg-all,!hg-ab
    contacts                ops
    first_notification      5
    last_notification       5
}

# 6: "!" in the host list of a service escalation, no host group.
define serviceescalation {
    host_name               alpha,beta,gamma,!beta
    service_description     Ping
    contacts                ops
    first_notification      6
    last_notification       6
}

# 7: a host group, and "!" in the host list.
define serviceescalation {
    hostgroup_name          hg-all
    host_name               !beta
    service_description     Ping
    contacts                ops
    first_notification      7
    last_notification       7
}

# 8: "!" in the description list.
define serviceescalation {
    host_name               alpha
    service_description     Ping,Load,!Load
    contacts                ops
    first_notification      8
    last_notification       8
}

# 9: the same with "*".
define serviceescalation {
    host_name               alpha
    service_description     *,!Load
    contacts                ops
    first_notification      9
    last_notification       9
}
