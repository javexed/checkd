# Every setting on the main configuration page of the Naemon docs, in page
# order, to learn which ones Naemon 1.5.2 accepts and what it says about
# the rest. Left out: include_dir and broker_module (they load other files)
# and the three settings the oracle sets itself.

config_rel_path=/case
cfg_file=common.cfg
cfg_file=objects.cfg
object_cache_file=/case/var/objects.cache
resource_file=resource.cfg
temp_file=/case/var/naemon.tmp
temp_path=/tmp
status_file=/case/var/status.dat
status_update_interval=15
naemon_user=naemon
naemon_group=naemon
enable_notifications=1
execute_service_checks=1
accept_passive_service_checks=1
execute_host_checks=1
accept_passive_host_checks=1
enable_event_handlers=1
check_external_commands=1
command_file=/case/var/naemon.cmd
lock_file=/case/var/naemon.pid
retain_state_information=1
state_retention_file=/case/var/retention.dat
retention_update_interval=60
use_retained_program_state=1
use_retained_scheduling_info=1
retained_scheduling_randomize_window=60
retained_host_attribute_mask=0
retained_service_attribute_mask=0
retained_process_host_attribute_mask=0
retained_process_service_attribute_mask=0
retained_contact_host_attribute_mask=0
retained_contact_service_attribute_mask=0
use_syslog=0
log_notifications=1
log_global_notifications=1
log_service_retries=1
log_host_retries=1
log_event_handlers=1
log_initial_states=1
log_external_commands=1
log_passive_checks=1
global_host_event_handler=global_handler
global_service_event_handler=global_handler
global_host_notification_handler=global_handler
global_service_notification_handler=global_handler
service_inter_check_delay_method=s
max_service_check_spread=30
service_interleave_factor=s
max_concurrent_checks=20
check_result_reaper_frequency=5
max_check_result_reaper_time=30
max_check_result_file_age=3600
host_inter_check_delay_method=s
max_host_check_spread=30
interval_length=60
auto_reschedule_checks=1
auto_rescheduling_interval=30
auto_rescheduling_window=180
use_aggressive_host_checking=0
translate_passive_host_checks=1
passive_host_checks_are_soft=1
enable_predictive_host_dependency_checks=1
enable_predictive_service_dependency_checks=1
cached_host_check_horizon=15
cached_service_check_horizon=15
use_large_installation_tweaks=0
free_child_process_memory=0
child_processes_fork_twice=0
enable_environment_macros=0
enable_flap_detection=1
low_service_flap_threshold=25.0
high_service_flap_threshold=50.0
low_host_flap_threshold=25.0
high_host_flap_threshold=50.0
soft_state_dependencies=0
service_check_timeout=60
host_check_timeout=60
event_handler_timeout=60
notification_timeout=60
ocsp_timeout=5
ochp_timeout=5
perfdata_timeout=5
obsess_over_services=1
ocsp_command=global_handler
obsess_over_hosts=1
ochp_command=global_handler
process_performance_data=1
host_perfdata_command=global_handler
service_perfdata_command=global_handler
host_perfdata_file=/case/var/host-perfdata.dat
service_perfdata_file=/case/var/service-perfdata.dat
host_perfdata_file_template=$TIMET$\t$HOSTNAME$\t$HOSTPERFDATA$
service_perfdata_file_template=$TIMET$\t$HOSTNAME$\t$SERVICEDESC$\t$SERVICEPERFDATA$
host_perfdata_file_mode=a
service_perfdata_file_mode=a
host_perfdata_file_processing_interval=0
service_perfdata_file_processing_interval=0
host_perfdata_file_processing_command=global_handler
service_perfdata_file_processing_command=global_handler
check_for_orphaned_services=1
check_for_orphaned_hosts=1
check_service_freshness=1
service_freshness_check_interval=60
check_host_freshness=1
host_freshness_check_interval=60
additional_freshness_latency=15
date_format=iso8601
use_timezone=Europe/Amsterdam
illegal_object_name_chars=`~!$%^&*"|'<>?,()=
illegal_macro_output_chars=`~$^&"|'<>
use_regexp_matching=0
use_true_regexp_matching=0
admin_email=admin@example.test
admin_pager=admin-pager@example.test
event_broker_options=-1
debug_file=/case/var/naemon.debug
debug_level=0
debug_verbosity=1
max_debug_file_size=1000000
check_workers=2
query_socket=/case/var/naemon.qh
allow_circular_dependencies=0
host_down_disable_service_checks=1
