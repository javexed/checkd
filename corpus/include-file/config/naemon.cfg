# include_file reads another file of main config settings, as if its lines
# stood here. What shows it in the result:
#
# - host_check_timeout is 11 here and 22 in the included file, which comes
#   later, so hosts get 22.
# - service_check_timeout is 33 in the included file and 44 here, after the
#   include, so services get 44.
# - The object file with the hosts is named only in a file that the
#   included file includes.
# - A path that is not absolute is taken from the directory of this file,
#   also in a file that sits in another directory.

cfg_file=common.cfg
host_check_timeout=11
include_file=/case/more/absolute
include_file=more/first.inc
service_check_timeout=44
