# A service defined twice for one host, both times by host group.
# Naemon keeps one of the two and warns. Which one depends on the "first
# host" of each definition:
#
#   - on the first host of both definitions the later definition is kept;
#   - on a host that is the first host of one definition only, the other
#     definition is kept;
#   - on every other host the earlier definition is kept.
#
# Every service below is defined twice with the same hosts, so the later
# definition (`notes second`) is kept on the first host and nowhere else.
#
# Host groups come before host names, whichever is written first in the
# definition. A host group gives its hosts in the reverse of the order in
# which they were added to it:
#
#   1. the hosts of its member groups, in the order the groups are
#      written, each group giving its hosts in its own order;
#   2. the hosts that name the group in their `hostgroups`, in the order
#      the hosts are defined;
#   3. its own `members`, in the order written, with `*` giving the last
#      defined host first.
#
# A host that is added again moves to the later place.

define host {
    use             base-host
    host_name       mike
    address         192.0.2.1
    hostgroups      by-host,members-and-host
}

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.2
    hostgroups      by-host,more-by-host
}

define host {
    use             base-host
    host_name       zulu
    address         192.0.2.3
}

define host {
    use             base-host
    host_name       echo
    address         192.0.2.4
}

define host {
    use             base-host
    host_name       kilo
    address         192.0.2.5
    hostgroups      by-host,nested-and-host
}

define host {
    use             base-host
    host_name       bravo
    address         192.0.2.6
    hostgroups      more-by-host,nested-and-host
}

define hostgroup {
    hostgroup_name  plain
    members zulu,alpha,mike
}

define hostgroup {
    hostgroup_name  single
    members echo
}

define hostgroup {
    hostgroup_name  by-host
}

define hostgroup {
    hostgroup_name  more-by-host
    members zulu,echo
}

define hostgroup {
    hostgroup_name  members-and-host
    members alpha,mike
}

define hostgroup {
    hostgroup_name  two-lines
    members zulu,alpha
    members mike,echo
}

define hostgroup {
    hostgroup_name  star
    members *
}

define hostgroup {
    hostgroup_name  with-exclusion
    members alpha,zulu,mike,echo,!echo
}

define hostgroup {
    hostgroup_name  member-twice
    members echo,alpha,echo,zulu
}

define hostgroup {
    hostgroup_name  nested
    hostgroup_members plain,single
}

define hostgroup {
    hostgroup_name  nested-reversed
    hostgroup_members single,plain
}

define hostgroup {
    hostgroup_name  nested-two-lines
    hostgroup_members single
    hostgroup_members plain
}

define hostgroup {
    hostgroup_name  nested-and-member
    members kilo
    hostgroup_members plain
}

define hostgroup {
    hostgroup_name  nested-and-same-member
    members mike
    hostgroup_members plain
}

define hostgroup {
    hostgroup_name  nested-and-host
    hostgroup_members plain
}

define hostgroup {
    hostgroup_name  nested-twice
    hostgroup_members nested-and-host,single
    members zulu
}

# The last member written.
define service {
    use                     base-service
    hostgroup_name plain
    service_description     plain
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name plain
    service_description     plain
    notes                   second
}

# The last defined host that names the group.
define service {
    use                     base-service
    hostgroup_name by-host
    service_description     by-host
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name by-host
    service_description     by-host
    notes                   second
}

# `members` are added after the hosts that name the group.
define service {
    use                     base-service
    hostgroup_name more-by-host
    service_description     more-by-host
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name more-by-host
    service_description     more-by-host
    notes                   second
}

# mike names the group and is a member: the member line counts.
define service {
    use                     base-service
    hostgroup_name members-and-host
    service_description     members-and-host
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name members-and-host
    service_description     members-and-host
    notes                   second
}

# The second `members` line is added after the first.
define service {
    use                     base-service
    hostgroup_name two-lines
    service_description     two-lines
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name two-lines
    service_description     two-lines
    notes                   second
}

# `*` adds the last defined host first, so the first defined host is added last.
define service {
    use                     base-service
    hostgroup_name star
    service_description     star
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name star
    service_description     star
    notes                   second
}

# The excluded member is not in the group.
define service {
    use                     base-service
    hostgroup_name with-exclusion
    service_description     with-exclusion
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name with-exclusion
    service_description     with-exclusion
    notes                   second
}

# A member written twice.
define service {
    use                     base-service
    hostgroup_name member-twice
    service_description     member-twice
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name member-twice
    service_description     member-twice
    notes                   second
}

# The last member group's hosts are added last.
define service {
    use                     base-service
    hostgroup_name nested
    service_description     nested
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name nested
    service_description     nested
    notes                   second
}

# A member group gives its hosts in its own order, so its first written member is added last.
define service {
    use                     base-service
    hostgroup_name nested-reversed
    service_description     nested-reversed
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name nested-reversed
    service_description     nested-reversed
    notes                   second
}

# Two `hostgroup_members` lines are one list.
define service {
    use                     base-service
    hostgroup_name nested-two-lines
    service_description     nested-two-lines
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name nested-two-lines
    service_description     nested-two-lines
    notes                   second
}

# `members` are added after the member groups.
define service {
    use                     base-service
    hostgroup_name nested-and-member
    service_description     nested-and-member
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name nested-and-member
    service_description     nested-and-member
    notes                   second
}

# A member that a member group has already added moves to the later place.
define service {
    use                     base-service
    hostgroup_name nested-and-same-member
    service_description     nested-and-same-member
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name nested-and-same-member
    service_description     nested-and-same-member
    notes                   second
}

# Hosts that name the group are added after the member groups.
define service {
    use                     base-service
    hostgroup_name nested-and-host
    service_description     nested-and-host
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name nested-and-host
    service_description     nested-and-host
    notes                   second
}

# Two levels of member groups.
define service {
    use                     base-service
    hostgroup_name nested-twice
    service_description     nested-twice
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name nested-twice
    service_description     nested-twice
    notes                   second
}

# The first group written comes first.
define service {
    use                     base-service
    hostgroup_name plain,single
    service_description     two-groups
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name plain,single
    service_description     two-groups
    notes                   second
}

# The same.
define service {
    use                     base-service
    hostgroup_name single,plain
    service_description     two-groups-reversed
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name single,plain
    service_description     two-groups-reversed
    notes                   second
}

# An excluded group is not in the list.
define service {
    use                     base-service
    hostgroup_name !single,plain
    service_description     group-excluded-first
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name !single,plain
    service_description     group-excluded-first
    notes                   second
}

# Groups come before names.
define service {
    use                     base-service
    hostgroup_name plain
    host_name echo
    service_description     group-and-name
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name plain
    host_name echo
    service_description     group-and-name
    notes                   second
}

# The same, written the other way round.
define service {
    use                     base-service
    host_name echo
    hostgroup_name plain
    service_description     name-and-group
    notes                   first
}

define service {
    use                     base-service
    host_name echo
    hostgroup_name plain
    service_description     name-and-group
    notes                   second
}

# A name that the group already has, and that is not the first host.
define service {
    use                     base-service
    hostgroup_name plain
    host_name zulu
    service_description     group-and-other-name
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name plain
    host_name zulu
    service_description     group-and-other-name
    notes                   second
}

# The first host is named again by `host_name`: no first host.
define service {
    use                     base-service
    hostgroup_name plain
    host_name mike
    service_description     group-and-first-name
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name plain
    host_name mike
    service_description     group-and-first-name
    notes                   second
}

# The same: echo comes from the group and is named again.
define service {
    use                     base-service
    host_name echo,mike
    hostgroup_name single
    service_description     name-and-own-group
    notes                   first
}

define service {
    use                     base-service
    host_name echo,mike
    hostgroup_name single
    service_description     name-and-own-group
    notes                   second
}

# The group is written twice, so its first host comes again: no first host.
define service {
    use                     base-service
    hostgroup_name plain,plain
    service_description     group-twice
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name plain,plain
    service_description     group-twice
    notes                   second
}

# The second group has mike too: no first host.
define service {
    use                     base-service
    hostgroup_name plain,two-lines
    service_description     overlapping-groups
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name plain,two-lines
    service_description     overlapping-groups
    notes                   second
}

# The groups overlap, but not in the first host.
define service {
    use                     base-service
    hostgroup_name single,plain,by-host
    service_description     overlap-not-first
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name single,plain,by-host
    service_description     overlap-not-first
    notes                   second
}

# The first host is excluded by name: no first host.
define service {
    use                     base-service
    hostgroup_name plain,!single
    host_name !mike
    service_description     first-excluded-by-name
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name plain,!single
    host_name !mike
    service_description     first-excluded-by-name
    notes                   second
}

# The first host is excluded with its group: no first host.
define service {
    use                     base-service
    hostgroup_name plain,single,!plain
    service_description     first-excluded-by-group
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name plain,single,!plain
    service_description     first-excluded-by-group
    notes                   second
}

# Another host is excluded.
define service {
    use                     base-service
    hostgroup_name plain
    host_name !zulu
    service_description     other-excluded-by-name
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name plain
    host_name !zulu
    service_description     other-excluded-by-name
    notes                   second
}
