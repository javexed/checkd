# A service escalation with a host and no service description.

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

define service {
    use                     base-service
    host_name               alpha
    service_description     ping
}

define serviceescalation {
    host_name               alpha
    contacts                ops
    first_notification      1
    last_notification       2
}
