# There is a host called "null" (`null-names`), but `host_name null` on a
# service still means no host.

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

define service {
    use                     base-service
    host_name               alpha
    service_description     ping
}

define host {
    use             base-host
    host_name       null
    address         192.0.2.2
}

define service {
    use                     base-service
    host_name               null
    service_description     on-null
}
