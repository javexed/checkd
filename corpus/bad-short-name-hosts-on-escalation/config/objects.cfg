# `hosts` is read as `host_name` on a service (`short-names`), but not on
# an escalation.

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

define service {
    use                     base-service
    host_name               alpha
    service_description     ping
}

define hostescalation {
    hosts                   alpha
    contacts                ops
    first_notification      1
    last_notification       2
}
