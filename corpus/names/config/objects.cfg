# Names: letter case, spaces, punctuation, and how names sort in the dump.

# Two hosts that differ only in letter case.
define host {
    use         base-host
    host_name   server
    address     192.0.2.10
}

define host {
    use         base-host
    host_name   Server
    address     192.0.2.11
}

define host {
    use         base-host
    host_name   SERVER
    address     192.0.2.12
}

# A host name with spaces.
define host {
    use         base-host
    host_name   web server 1
    address     192.0.2.13
}

# Punctuation that host names often carry.
define host {
    use         base-host
    host_name   db-1.example.test
    address     192.0.2.14
}

define host {
    use         base-host
    host_name   rack_3/slot:7
    address     192.0.2.15
}

define host {
    use         base-host
    host_name   10.0.0.1
    address     192.0.2.16
}

define host {
    use         base-host
    host_name   _underscore
    address     192.0.2.17
}

define host {
    use         base-host
    host_name   -dash
    address     192.0.2.18
}

# Names chosen to show the sort order: digits, capitals, prefixes.
define host {
    use         base-host
    host_name   web-1
    address     192.0.2.20
}

define host {
    use         base-host
    host_name   web-10
    address     192.0.2.21
}

define host {
    use         base-host
    host_name   web-2
    address     192.0.2.22
}

define host {
    use         base-host
    host_name   web
    address     192.0.2.23
}

define host {
    use         base-host
    host_name   web-1a
    address     192.0.2.24
}

define host {
    use         base-host
    host_name   Web-1
    address     192.0.2.25
}

# Two services that differ only in letter case, and a few for sorting.
define service {
    use                     base-service
    host_name               server
    service_description     ping
}

define service {
    use                     base-service
    host_name               server
    service_description     Ping
}

define service {
    use                     base-service
    host_name               server
    service_description     PING
}

define service {
    use                     base-service
    host_name               web-1,web-10,web-1a,web
    service_description     Check
}

define service {
    use                     base-service
    host_name               web-1
    service_description     0 first
}

define service {
    use                     base-service
    host_name               web-1
    service_description     a last
}

define service {
    use                     base-service
    host_name               web server 1
    service_description     Disk  two  spaces
}

# Group and contact names in mixed case.
define hostgroup {
    hostgroup_name  Mixed-Case
    members         server,Server
}

define hostgroup {
    hostgroup_name  mixed-case
    members         SERVER
}

# A host list that names the host with spaces.
define hostgroup {
    hostgroup_name  with spaces in the name
    members         web server 1,web-1
}
