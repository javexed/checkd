# use_regexp_matching=1: patterns in the members of a service group, which
# are pairs of host name and service description. Also in the host list of
# a service escalation and a service dependency, for comparison.

define host {
    use         base-host
    host_name   web-1
    address     192.0.2.10
}

define host {
    use         base-host
    host_name   web-2
    address     192.0.2.11
}

define host {
    use         base-host
    host_name   db-1
    address     192.0.2.12
}

define service {
    use                     base-service
    host_name               web-1,web-2,db-1
    service_description     Star suffix
}

define service {
    use                     base-service
    host_name               web-1,web-2,db-1
    service_description     Other
}

# Both halves are patterns.
define servicegroup {
    servicegroup_name   sg-both-patterns
    members             web-.*,Star.*
}

# The host is a pattern, the description is a plain name.
define servicegroup {
    servicegroup_name   sg-host-pattern
    members             web-.*,Star suffix
}

# The host is a plain name, the description is a pattern.
define servicegroup {
    servicegroup_name   sg-description-pattern
    members             web-1,Star.*
}

# An anchored description.
define servicegroup {
    servicegroup_name   sg-anchored-description
    members             web-.*,^Other$
}

# A description that no service has.
define servicegroup {
    servicegroup_name   sg-no-such-description
    members             web-.*,Nothing like it
}

# A plain pair and a pattern pair.
define servicegroup {
    servicegroup_name   sg-two-pairs
    members             db-1,Other,web-.*,Star suffix
}

define serviceescalation {
    host_name               web-.*
    service_description     Other
    contacts                ops
    first_notification      1
    last_notification       1
}

define serviceescalation {
    host_name               web-.*
    service_description     Oth.*
    contacts                ops
    first_notification      2
    last_notification       2
}

define servicedependency {
    host_name                       db-1
    service_description             Other
    dependent_host_name             web-.*
    dependent_service_description   Other
    execution_failure_criteria      c
}
