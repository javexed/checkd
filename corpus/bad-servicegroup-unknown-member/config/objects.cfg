# A service group lists a service that is not defined on that host.

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.10
}

define service {
    use                     base-service
    host_name               alpha
    service_description     Ping
}

define servicegroup {
    servicegroup_name   sg-web
    members             alpha,Ping,alpha,Ghost
}
