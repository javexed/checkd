# Lists that are valid and leave no host, service or contact. Naemon
# accepts each of these and makes nothing of it, without a message. An
# escalation, a hostextinfo and an object's own groups are refused for the
# same (`bad-hostescalation-empty-hostgroup` and the cases beside it).

# Services for no host.
define service {
    use                    base-service
    hostgroup_name         spare
    service_description    on-spare
}

define service {
    use                    base-service
    hostgroup_name         web,!web
    service_description    excluded-away
}

define service {
    use                    base-service
    hostgroup_name         !db
    service_description    group-exclusion-only
}

define service {
    use                    base-service
    host_name              !beta
    service_description    host-exclusion-only
}

# Service dependencies with no service on one side.
define servicedependency {
    hostgroup_name                   spare
    service_description              ping
    dependent_host_name              gamma
    dependent_service_description    load
    execution_failure_options        c
}

define servicedependency {
    host_name                        gamma
    service_description              ping
    dependent_hostgroup_name         spare
    dependent_service_description    load
    execution_failure_options        c
}

define servicedependency {
    host_name                        alpha,!alpha
    service_description              ping
    dependent_host_name              gamma
    dependent_service_description    load
    execution_failure_options        c
}

define servicedependency {
    hostgroup_name                   !db
    service_description              ping
    dependent_host_name              gamma
    dependent_service_description    load
    execution_failure_options        c
}

define servicedependency {
    servicegroup_name                sg-spare
    dependent_host_name              gamma
    dependent_service_description    load
    execution_failure_options        c
}

define servicedependency {
    servicegroup_name                !sg-load
    dependent_host_name              gamma
    dependent_service_description    load
    execution_failure_options        c
}

define servicedependency {
    host_name                      gamma
    service_description            ping
    dependent_servicegroup_name    sg-spare
    execution_failure_options      c
}

# Host dependencies with no host on one side.
define hostdependency {
    hostgroup_name               spare
    dependent_host_name          gamma
    execution_failure_options    d
}

define hostdependency {
    hostgroup_name               web,!web
    dependent_host_name          gamma
    execution_failure_options    d
}

define hostdependency {
    host_name                    alpha
    dependent_hostgroup_name     !db
    execution_failure_options    d
}

# Groups with no member.
define hostgroup {
    hostgroup_name    none-left
    members           alpha,!alpha
}

define hostgroup {
    hostgroup_name    exclusion-only
    members           !beta
}

define contactgroup {
    contactgroup_name    none-left
    members              ops,!ops
}

define contactgroup {
    contactgroup_name    exclusion-only
    members              !second
}

# A `!` before the description of a service group member. The pair
# adds nothing and takes nothing out.
define servicegroup {
    servicegroup_name    pairs
    members              beta,ping,alpha,!load
}

# A serviceextinfo for no host.
define serviceextinfo {
    hostgroup_name         spare
    service_description    ping
    notes                  Not used 1
}

define serviceextinfo {
    hostgroup_name         web,!web
    service_description    ping
    notes                  Not used 2
}

define serviceextinfo {
    host_name              alpha,!alpha
    service_description    ping
    notes                  Not used 3
}

define serviceextinfo {
    hostgroup_name         !db
    service_description    ping
    notes                  Not used 4
}

define serviceextinfo {
    host_name              !beta
    service_description    ping
    notes                  Not used 5
}

define serviceextinfo {
    hostgroup_name         web
    host_name              !alpha
    service_description    ping
    notes                  Not used 6
}

define serviceextinfo {
    host_name              alpha
    service_description    ping,!ping
    notes                  Not used 7
}
