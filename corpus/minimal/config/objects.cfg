define command {
    command_name    check_dummy
    command_line    /usr/lib/checkd-test/check_dummy $ARG1$
}

define timeperiod {
    timeperiod_name always
    alias           Every hour of every day
    monday          00:00-24:00
    tuesday         00:00-24:00
    wednesday       00:00-24:00
    thursday        00:00-24:00
    friday          00:00-24:00
    saturday        00:00-24:00
    sunday          00:00-24:00
}

define contact {
    contact_name                    ops
    host_notification_period        always
    service_notification_period     always
    host_notification_options       d,u,r
    service_notification_options    w,u,c,r
    host_notification_commands      check_dummy
    service_notification_commands   check_dummy
}

define host {
    name                    base-host
    register                0
    check_command           check_dummy!0
    max_check_attempts      3
    check_period            always
    notification_period     always
    contacts                ops
}

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.10
}

define service {
    host_name               alpha
    service_description     Dummy
    check_command           check_dummy!0
    max_check_attempts      2
    check_period            always
    notification_period     always
    contacts                ops
}
