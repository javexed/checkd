# Parent hosts: a chain, a host with two parents, and a parent that is
# defined after its child. The docs also list "parents" for services.

define host {
    use         base-host
    host_name   server-b
    address     192.0.2.21
    parents     switch-1,switch-2
}

define host {
    use         base-host
    host_name   server-a
    address     192.0.2.20
    parents     switch-1
}

define host {
    use         base-host
    host_name   switch-1
    address     192.0.2.11
    parents     router
}

define host {
    use         base-host
    host_name   switch-2
    address     192.0.2.12
    parents     router
}

define host {
    use         base-host
    host_name   router
    address     192.0.2.1
}

# Parents set in a template and extended with "+".
define host {
    name        behind-switch-1
    use         base-host
    register    0
    parents     switch-1
}

define host {
    use         behind-switch-1
    host_name   server-c
    address     192.0.2.22
    parents     +switch-2
}

define host {
    use         behind-switch-1
    host_name   server-d
    address     192.0.2.23
    parents     null
}

define service {
    use                     base-service
    host_name               server-a
    service_description     Database
}

define service {
    use                     base-service
    host_name               server-a
    service_description     Application
}

define service {
    use                     base-service
    host_name               server-a
    service_description     Website
    parents                 Application
}

# A parent service on another host, written as host,service.
define service {
    use                     base-service
    host_name               server-b
    service_description     Report
    parents                 server-a,Database
}
