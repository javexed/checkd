# `hostgroup` is read as `hostgroup_name` on a service (`short-names`),
# but a host has `hostgroups` only.

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

define service {
    use                     base-service
    host_name               alpha
    service_description     ping
}

define hostgroup {
    hostgroup_name  web
}

define host {
    use             base-host
    host_name       beta
    address         192.0.2.2
    hostgroup       web
}
