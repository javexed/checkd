# With `use_regexp_matching` on, an object's own `hostgroups`,
# `servicegroups` or `contactgroups` setting takes patterns.

# Joins web.
define host {
    use           base-host
    host_name     delta
    address       192.0.2.4
    hostgroups    w.*
}

# Joins web and spare.
define host {
    use           base-host
    host_name     epsilon
    address       192.0.2.5
    hostgroups    .*,!db
}

define service {
    use                    base-service
    host_name              gamma
    service_description    disk
    servicegroups          sg-.*
}

define contact {
    use              base-contact
    contact_name     third
    contactgroups    cg-d.*
}
