# `null` where a name is expected. It is a name like any other: there can
# be a host, a contact, a group, a command and a timeperiod called "null".
# Where a list of names is expected, `null` alone still means "nothing",
# and `null` among other names is the object called "null".

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

define host {
    use             base-host
    host_name       null
    address         192.0.2.2
}

define service {
    use                     base-service
    host_name               alpha
    service_description     ping
}

define contact {
    use             base-contact
    contact_name    null
}

define contactgroup {
    contactgroup_name   null
    alias               null
    members             null
}

define contactgroup {
    contactgroup_name   real
    alias               null
    members             ops,null
}

define hostgroup {
    hostgroup_name  null
    alias           null
    members         alpha
}

define hostgroup {
    hostgroup_name  with-null-host
    members         alpha,null
}

define servicegroup {
    servicegroup_name   null
    alias               null
    members             alpha,ping
}

define command {
    command_name    null
    command_line    null
}

define timeperiod {
    timeperiod_name null
    alias           null
    monday          00:00-24:00
}

# `contacts null` is no contacts, so the contact group is what is left.
define host {
    use             base-host
    host_name       beta
    address         192.0.2.3
    contacts        null
    contact_groups  real
}

# Here `null` is the contact of that name.
define host {
    use             base-host
    host_name       gamma
    address         192.0.2.4
    contacts        ops,null
}

# The command, the timeperiod and the groups called "null", used by name
# where `null` is not the only word.
define host {
    use                     base-host
    host_name               delta
    address                 192.0.2.5
    parents                 alpha,null
    hostgroups              with-null-host,null
    contact_groups          real,null
}
