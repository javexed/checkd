# Nine settings that `main-settings` does not have. Naemon 1.5.2 knows
# all nine. allow_empty_hostgroup_assignment changes how host dependencies
# are checked: see `hostdependency-strict`.

cfg_file=common.cfg
cfg_file=objects.cfg
log_archive_path=/case/var/archives
enable_notification_suppression_reason_logging=1
log_current_states=0
service_check_timeout_state=c
allow_empty_hostgroup_assignment=1
service_parents_disable_service_checks=1
service_skip_check_dependency_status=-2
service_skip_check_host_down_status=3
host_skip_check_dependency_status=-1
