# The ways a service escalation can say which services it is about: hosts
# (or host groups) with a description, a service group, or both.

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

define host {
    use             base-host
    host_name       beta
    address         192.0.2.2
}

define hostgroup {
    hostgroup_name  web
    members         alpha,beta
}

define servicegroup {
    servicegroup_name   pings
}

define servicegroup {
    servicegroup_name   disks
}

define service {
    use                     base-service
    host_name               alpha,beta
    service_description     ping
    servicegroups           pings
}

define service {
    use                     base-service
    host_name               alpha,beta
    service_description     disk
    servicegroups           disks
}

# Only alpha has this one.
define service {
    use                     base-service
    host_name               alpha
    service_description     load
}

# A host and a description.
define serviceescalation {
    host_name              alpha
    service_description    load
    contacts               ops
    first_notification     1
    last_notification      2
}

# A host group and a description.
define serviceescalation {
    hostgroup_name           web
    service_description      ping
    notification_interval    10
    contacts                 ops
    first_notification       1
    last_notification        2
}

# A host group, a host and a description.
define serviceescalation {
    hostgroup_name           web
    host_name                alpha
    service_description      disk
    notification_interval    20
    contacts                 ops
    first_notification       1
    last_notification        2
}

# Every service of a host.
define serviceescalation {
    host_name                beta
    service_description      *
    notification_interval    30
    contacts                 ops
    first_notification       1
    last_notification        2
}

# A service group.
define serviceescalation {
    servicegroup_name        pings
    notification_interval    40
    contacts                 ops
    first_notification       1
    last_notification        2
}

# Two service groups.
define serviceescalation {
    servicegroup_name        pings,disks
    notification_interval    50
    contacts                 ops
    first_notification       1
    last_notification        2
}

# A service group and a service.
define serviceescalation {
    servicegroup_name        pings
    host_name                alpha
    service_description      load
    notification_interval    60
    contacts                 ops
    first_notification       1
    last_notification        2
}
