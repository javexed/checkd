# "register 0" on objects that are not used as templates, and what
# "register" does when it comes from a template.

# A complete host that is switched off.
define host {
    use         base-host
    host_name   switched-off
    address     192.0.2.10
    register    0
}

# The docs say "register" is not inherited. This host uses a template that
# has register 0 and sets nothing itself, so it should be registered.
define host {
    use         base-host
    host_name   switched-on
    address     192.0.2.11
}

# register 1 written out.
define host {
    use         base-host
    host_name   explicit
    address     192.0.2.12
    register    1
}

# A service that is switched off, on a host that is not.
define service {
    use                     base-service
    host_name               switched-on
    service_description     Off
    register                0
}

define service {
    use                     base-service
    host_name               switched-on
    service_description     On
}

# A group that is switched off but has members.
define hostgroup {
    hostgroup_name  hg-off
    members         switched-on
    register        0
}
