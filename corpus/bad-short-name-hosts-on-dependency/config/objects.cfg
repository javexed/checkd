# `hosts` is read as `host_name` on a service (`short-names`), but not on
# a dependency.

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

define service {
    use                     base-service
    host_name               alpha
    service_description     ping
}

define host {
    use             base-host
    host_name       beta
    address         192.0.2.2
}

define hostdependency {
    hosts                           alpha
    dependent_host_name             beta
    notification_failure_criteria   d
}
