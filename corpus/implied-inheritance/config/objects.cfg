# A service takes some settings from its host when neither the service nor
# its templates set them: contacts, contact_groups, check_period,
# notification_interval, notification_period. Escalations do the same from
# their host or service.
#
# base-service is not used here, because it sets most of these.

define timeperiod {
    timeperiod_name workhours
    alias           Working hours
    monday          09:00-17:00
    tuesday         09:00-17:00
    wednesday       09:00-17:00
    thursday        09:00-17:00
    friday          09:00-17:00
}

define contact {
    use             base-contact
    contact_name    dev
}

define contact {
    use             base-contact
    contact_name    manager
}

define contactgroup {
    contactgroup_name   cg-admins
    members             ops
}

define contactgroup {
    contactgroup_name   cg-managers
    members             manager
}

define host {
    host_name               alpha
    address                 192.0.2.10
    check_command           check_dummy!0
    max_check_attempts      3
    check_period            workhours
    notification_period     workhours
    notification_interval   45
    contacts                ops
    contact_groups          cg-admins
}

# Sets none of the five: all come from the host.
define service {
    host_name               alpha
    service_description     Inherits all
    check_command           check_dummy!0
    max_check_attempts      3
}

# Sets contacts: the docs say contact_groups is then not taken from the host.
define service {
    host_name               alpha
    service_description     Own contacts
    check_command           check_dummy!0
    max_check_attempts      3
    contacts                dev
}

# Sets contact_groups only.
define service {
    host_name               alpha
    service_description     Own contact groups
    check_command           check_dummy!0
    max_check_attempts      3
    contact_groups          cg-managers
}

# The template sets two of the five, so those are not taken from the host.
define service {
    name                    quiet-service
    register                0
    notification_interval   0
    check_period            always
}

define service {
    use                     quiet-service
    host_name               alpha
    service_description     From template
    check_command           check_dummy!0
    max_check_attempts      3
}

# "+" on a service: is the host's value merged in, as it is for escalations?
define service {
    host_name               alpha
    service_description     Additive contacts
    check_command           check_dummy!0
    max_check_attempts      3
    contacts                +dev
}

# Host escalation with no contacts, interval or period of its own.
define hostescalation {
    host_name               alpha
    first_notification      2
    last_notification       5
}

# Additive on an escalation: the docs say the host's groups are merged in.
define hostescalation {
    host_name               alpha
    first_notification      6
    last_notification       0
    contact_groups          +cg-managers
}

# Service escalation on a service that itself inherits from the host.
define serviceescalation {
    host_name               alpha
    service_description     Inherits all
    first_notification      2
    last_notification       5
}

define serviceescalation {
    host_name               alpha
    service_description     Own contacts
    first_notification      3
    last_notification       0
    contacts                +manager
}
