# Times of day that are not plain HH:MM. What is each one read as?

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.10
}

define timeperiod {
    timeperiod_name loose-times
    alias           Loose times
    sunday          09:75-17:00
    monday          9:5-17:00
    tuesday         09:00-17:99
    wednesday       09:00:30-17:00
    thursday        09:00-17:00:59
    friday          09:00-23:60
    saturday        009:00-017:00
}
