# In a host dependency, a host escalation and a hostextinfo, a `!` takes
# hosts out of the host groups only. A host that `host_name` names stays,
# whatever is excluded by name or by group. (With no host group at all the
# `!` does nothing: `escalation-exclusions`, `dependency-exclusions`.)
# A service and a serviceextinfo do take the named host out.
# Naemon says nothing; checkd warns.
#
# Each escalation has its own first_notification, so the dump shows which
# one made an entry.

# A host group with alpha and beta, and a host for the other side of a
# dependency.
define hostgroup {
    hostgroup_name    both
    members           alpha,beta
}

define host {
    use          base-host
    host_name    delta
    address      192.0.2.4
}

# 1: alpha and beta. alpha is named, so it stays.
define hostescalation {
    hostgroup_name           both
    host_name                alpha,!alpha
    contacts                 ops
    first_notification       1
    last_notification        9
    notification_interval    5
}

# 2: beta only. alpha is not named, and is taken out of the group.
define hostescalation {
    hostgroup_name           both
    host_name                !alpha
    contacts                 ops
    first_notification       2
    last_notification        9
    notification_interval    5
}

# 3: alpha and beta. alpha is in the excluded group, and is named.
define hostescalation {
    hostgroup_name           db,!web
    host_name                alpha
    contacts                 ops
    first_notification       3
    last_notification        9
    notification_interval    5
}

# 4: alpha three times: only the group's alpha is taken out.
define hostescalation {
    hostgroup_name           web
    host_name                alpha,alpha,alpha,!alpha
    contacts                 ops
    first_notification       4
    last_notification        9
    notification_interval    5
}

# Host dependencies: gamma depends on alpha and beta, and alpha and beta
# depend on delta.
define hostdependency {
    hostgroup_name               both
    host_name                    alpha,!alpha
    dependent_host_name          gamma
    execution_failure_options    d
}

define hostdependency {
    host_name                    delta
    dependent_hostgroup_name     db,!web
    dependent_host_name          alpha
    execution_failure_options    d
}

# A hostextinfo: for alpha and beta.
define hostextinfo {
    hostgroup_name    both
    host_name         alpha,!alpha
    notes             Named hosts stay
}

# A service and a serviceextinfo: for beta only.
define service {
    use                    base-service
    hostgroup_name         both
    host_name              alpha,!alpha
    service_description    on-beta-only
}

define serviceextinfo {
    hostgroup_name         both
    host_name              alpha,!alpha
    service_description    ping
    notes                  For ping on beta only
}
