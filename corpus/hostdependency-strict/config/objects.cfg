define hostdependency {
    host_name                    alpha
    dependent_host_name          gamma
    execution_failure_options    d
}

# No host on either side: dropped without a word, as with the setting on.
define hostdependency {
    execution_failure_options    d
}

# The same with a template name.
define hostdependency {
    name                         dep-defaults
    register                     0
    execution_failure_options    d
}

# A group with no members beside a host that is named.
define hostdependency {
    hostgroup_name               spare
    host_name                    beta
    dependent_host_name          gamma
    execution_failure_options    d
}

# A host that is named stays, whatever is excluded (`named-hosts-stay`).
define hostdependency {
    host_name                    alpha
    dependent_host_name          beta,!beta
    execution_failure_options    d
}
