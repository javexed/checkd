# An included file with a setting that does not exist. In the main file
# that refuses the configuration (`bad-main-unknown-setting`). In an
# included file Naemon prints the error, skips the rest of that file and
# accepts: hosts keep the check timeout of 11. checkd refuses it.
cfg_file=common.cfg
cfg_file=objects.cfg
host_check_timeout=11
include_file=extra.cfg
