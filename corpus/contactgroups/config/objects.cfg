# Contact group membership: listed in the group, listed on the contact, and
# groups inside groups. Hosts then name the groups.

define contact {
    use             base-contact
    contact_name    dev
    alias           Developer on duty
    email           dev@example.test
    address1        dev-chat
    address6        dev-backup
}

define contact {
    use             base-contact
    contact_name    manager
    contactgroups   cg-by-contact,cg-escalation
}

define contact {
    use             base-contact
    contact_name    night
    host_notifications_enabled      0
    service_notifications_enabled   0
    can_submit_commands             0
    retain_status_information       0
    retain_nonstatus_information    0
    minimum_value                   5
    host_notification_options       n
    service_notification_options    f,s
}

define contactgroup {
    contactgroup_name   cg-admins
    alias               Administrators
    members             ops,dev
}

define contactgroup {
    contactgroup_name   cg-by-contact
}

define contactgroup {
    contactgroup_name   cg-escalation
    members             night
    contactgroup_members    cg-admins
}

define contactgroup {
    contactgroup_name   cg-top
    contactgroup_members    cg-escalation
}

define contactgroup {
    contactgroup_name   cg-all
    members             *
}

define contactgroup {
    contactgroup_name   cg-empty
}

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.10
    contact_groups  cg-top,cg-empty
}

# A contact named directly and again through a group.
define host {
    use             base-host
    host_name       beta
    address         192.0.2.11
    contacts        dev,ops
    contact_groups  cg-admins
}
