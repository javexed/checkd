# `parallelize_check` is accepted and not used on a service
# (`settings-without-effect`). On a host it is refused.

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

define service {
    use                     base-service
    host_name               alpha
    service_description     ping
}

define host {
    use                 base-host
    host_name           beta
    address             192.0.2.2
    parallelize_check   1
}
