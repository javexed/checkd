# config_rel_path names the directory that paths which are not absolute
# are taken from. It holds for the lines after it. Before it, and without
# it, that is the directory of this file.
#
# Every file below exists twice, here and in site/, with different
# content. The hosts in the result show which one was read:
#
# - objects.cfg is named before config_rel_path: host `top`.
# - The cfg_file, cfg_dir and resource_file lines after it are taken from
#   site/: hosts `site-file` and `site-dir`.
# - So are include_file and include_dir: hosts get the check timeout 22
#   and services 33.
# - A file that is included from site/ can name one more object file, and
#   that is taken from site/ as well: host `site-included`.
# - The last line sets it back, and the path after it is taken from here:
#   host `top-last`.

cfg_file=common.cfg
cfg_file=objects.cfg
config_rel_path=/case/site
cfg_file=objects.cfg
cfg_dir=conf.d
resource_file=resource.cfg
include_file=more.inc
include_dir=main.d
config_rel_path=/case/
cfg_file=last.cfg
