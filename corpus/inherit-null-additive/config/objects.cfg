# "null" cancels an inherited string value. A leading "+" adds to the
# inherited value instead of replacing it.

define contact {
    use             base-contact
    contact_name    dev
}

define contactgroup {
    contactgroup_name   cg-admins
    members             ops
}

define contactgroup {
    contactgroup_name   cg-dev
    members             dev
}

define hostgroup {
    hostgroup_name  hg-all
}

define hostgroup {
    hostgroup_name  hg-web
}

define servicegroup {
    servicegroup_name   sg-all
}

define servicegroup {
    servicegroup_name   sg-web
}

define host {
    name                    tagged-host
    use                     base-host
    register                0
    hostgroups              hg-all
    contact_groups          cg-admins
    event_handler           check_dummy!1
    notes                   set in tagged-host
    notes_url               https://example.test/tagged
}

# Additive: member of hg-all and hg-web.
define host {
    use                     tagged-host
    host_name               alpha
    address                 192.0.2.10
    hostgroups              +hg-web
}

# Plain value replaces: member of hg-web only.
define host {
    use                     tagged-host
    host_name               beta
    address                 192.0.2.11
    hostgroups              hg-web
}

# null: no event handler, no notes, no hostgroups.
define host {
    use                     tagged-host
    host_name               gamma
    address                 192.0.2.12
    event_handler           null
    notes                   null
    hostgroups              null
}

# Additive contacts and contact groups.
define host {
    use                     tagged-host
    host_name               delta
    address                 192.0.2.13
    contacts                +dev
    contact_groups          +cg-dev
}

# "+" with nothing to add to: base-host sets no hostgroups.
define host {
    use                     base-host
    host_name               epsilon
    address                 192.0.2.14
    hostgroups              +hg-web
}

# "+" on a value that is not a list.
define host {
    use                     tagged-host
    host_name               zeta
    address                 192.0.2.15
    notes                   +and in zeta
}

# Additive through two levels.
define host {
    name                    tagged-web-host
    use                     tagged-host
    register                0
    hostgroups              +hg-web
}

define hostgroup {
    hostgroup_name  hg-extra
}

define host {
    use                     tagged-web-host
    host_name               eta
    address                 192.0.2.16
    hostgroups              +hg-extra
}

define service {
    name                    tagged-service
    use                     base-service
    register                0
    servicegroups           sg-all
    contact_groups          cg-admins
    event_handler           check_dummy!1
}

define service {
    use                     tagged-service
    host_name               alpha
    service_description     Additive
    servicegroups           +sg-web
    contact_groups          +cg-dev
}

define service {
    use                     tagged-service
    host_name               alpha
    service_description     Cancelled
    servicegroups           null
    event_handler           null
}

# contacts is cancelled here, and the host has contacts. Does the service
# take the host's, or end up with only its contact group?
define service {
    use                     tagged-service
    host_name               alpha
    service_description     No contacts
    contacts                null
}
