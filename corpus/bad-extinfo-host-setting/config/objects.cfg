# A hostextinfo takes only its own settings, not those of a host.

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.1
}

define host {
    use         base-host
    host_name   beta
    address     192.0.2.2
}

define host {
    use         base-host
    host_name   gamma
    address     192.0.2.3
    hostgroups  db
}

define hostgroup {
    hostgroup_name  web
    members         alpha,beta
}

define hostgroup {
    hostgroup_name  db
}

define hostgroup {
    hostgroup_name  mixed
    members         alpha,gamma
}

define service {
    use                     base-service
    host_name               alpha,beta
    service_description     ping
}

define service {
    use                     base-service
    host_name               alpha
    service_description     ssh
}

define hostextinfo {
    host_name   alpha
    alias       Ext Alias
}
