# How object files are written: spacing, comments, continuation lines and
# the older names of some settings.

; A comment line can also start with a semicolon.

# No space before the brace.
define host{
    use         base-host
    host_name   alpha
    address     192.0.2.10
}

# Extra spaces in the first line, and the closing brace indented.
define   host   {
    use         base-host
    host_name   beta
    address     192.0.2.11
    }

# Tabs between name and value, and spaces at the end of lines.
define host {
	use		base-host   
	host_name	gamma	
	address	192.0.2.12  	 
}

# No indentation, and blank and comment lines inside the definition.
define host {
use base-host

# a comment inside a definition
host_name delta
; another one
address 192.0.2.13
}

# Comments after values. A semicolon starts one; does "#" as well?
define host {
    use         base-host
    host_name   epsilon         ; the fifth host
    address     192.0.2.14      # not the fifth address
    notes       before;after
    notes_url   https://example.test/page#section
    action_url  https://example.test/a\;b
}

# A value continued on the next line with a backslash.
define host {
    use         base-host
    host_name   zeta
    address     192.0.2.15
    notes       first part, \
                second part
    alias       Zeta \
server
}

# Values with inner spaces, braces and quotes.
define host {
    use         base-host
    host_name   eta
    address     192.0.2.16
    alias       The   seventh    host
    notes       {braces} and "double" and 'single' quotes
    notes_url   https://example.test/?q=$HOSTNAME$&x={y}
}

# Older names for two settings.
define service {
    use                     base-service
    host_name               alpha
    service_description     Old names
    normal_check_interval   12
    retry_check_interval    4
}

# A service description with spaces, slashes and other punctuation.
define service {
    use                     base-service
    host_name               alpha
    service_description     Disk /var/log (95%) - nightly
}

# A command line with quotes, pipes, a continuation and an escaped semicolon.
define command {
    command_name    check_complex
    command_line    /usr/lib/checkd-test/check_dummy "$ARG1$" --text='a b' | \
                    /usr/lib/checkd-test/filter \; echo done
}

# Two definitions with nothing between them, and one on the last line of
# the file with no newline after the brace.
define host {
    use         base-host
    host_name   theta
    address     192.0.2.17
}
define host {
    use         base-host
    host_name   iota
    address     192.0.2.18
}