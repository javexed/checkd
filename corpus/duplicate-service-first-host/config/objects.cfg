# A service defined twice for one host, both times by host name.
# Naemon keeps one of the two and warns. Which one depends on the "first
# host" of each definition:
#
#   - on the first host of both definitions the later definition is kept;
#   - on a host that is the first host of one definition only, the other
#     definition is kept;
#   - on every other host the earlier definition is kept.
#
# Every service below is defined twice with the same hosts, so the later
# definition (`notes second`) is kept on the first host and nowhere else.
#
# The first host of a `host_name` list is the first name written. `*`
# stands for every host with the last defined host first. A definition
# has no first host when that host is written again further on in the
# list, or is excluded with `!`.

define host {
    use             base-host
    host_name       mike
    address         192.0.2.1
}

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.2
}

define host {
    use             base-host
    host_name       zulu
    address         192.0.2.3
}

define host {
    use             base-host
    host_name       echo
    address         192.0.2.4
}

define host {
    use             base-host
    host_name       kilo
    address         192.0.2.5
}

define host {
    use             base-host
    host_name       bravo
    address         192.0.2.6
}

# The first name written.
define service {
    use                     base-service
    host_name zulu,alpha,mike
    service_description     list
    notes                   first
}

define service {
    use                     base-service
    host_name zulu,alpha,mike
    service_description     list
    notes                   second
}

# One host.
define service {
    use                     base-service
    host_name echo
    service_description     single
    notes                   first
}

define service {
    use                     base-service
    host_name echo
    service_description     single
    notes                   second
}

# The first name is written again: no first host.
define service {
    use                     base-service
    host_name mike,zulu,mike,alpha
    service_description     first-again
    notes                   first
}

define service {
    use                     base-service
    host_name mike,zulu,mike,alpha
    service_description     first-again
    notes                   second
}

# Another name is written again: this changes nothing.
define service {
    use                     base-service
    host_name mike,zulu,zulu,alpha
    service_description     other-again
    notes                   first
}

define service {
    use                     base-service
    host_name mike,zulu,zulu,alpha
    service_description     other-again
    notes                   second
}

# The first name is excluded: no first host.
define service {
    use                     base-service
    host_name zulu,alpha,!zulu
    service_description     first-excluded
    notes                   first
}

define service {
    use                     base-service
    host_name zulu,alpha,!zulu
    service_description     first-excluded
    notes                   second
}

# The same, with the exclusion written first.
define service {
    use                     base-service
    host_name !zulu,zulu,alpha
    service_description     exclusion-first
    notes                   first
}

define service {
    use                     base-service
    host_name !zulu,zulu,alpha
    service_description     exclusion-first
    notes                   second
}

# Another name is excluded.
define service {
    use                     base-service
    host_name zulu,alpha,mike,!alpha
    service_description     other-excluded
    notes                   first
}

define service {
    use                     base-service
    host_name zulu,alpha,mike,!alpha
    service_description     other-excluded
    notes                   second
}

# The last defined host.
define service {
    use                     base-service
    host_name *
    service_description     star
    notes                   first
}

define service {
    use                     base-service
    host_name *
    service_description     star
    notes                   second
}

# The last defined host is excluded: no first host.
define service {
    use                     base-service
    host_name *,!bravo
    service_description     star-less-first
    notes                   first
}

define service {
    use                     base-service
    host_name *,!bravo
    service_description     star-less-first
    notes                   second
}

# Another host is excluded.
define service {
    use                     base-service
    host_name *,!kilo
    service_description     star-less-other
    notes                   first
}

define service {
    use                     base-service
    host_name *,!kilo
    service_description     star-less-other
    notes                   second
}

# `*` names alpha again: no first host.
define service {
    use                     base-service
    host_name alpha,*
    service_description     name-then-star
    notes                   first
}

define service {
    use                     base-service
    host_name alpha,*
    service_description     name-then-star
    notes                   second
}

# alpha is written again, and it is not the first host.
define service {
    use                     base-service
    host_name *,alpha
    service_description     star-then-name
    notes                   first
}

define service {
    use                     base-service
    host_name *,alpha
    service_description     star-then-name
    notes                   second
}
