# Spans whose second end leaves out what it shares with the first.

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.10
}

define timeperiod {
    timeperiod_name short-spans
    alias           Short spans
    monday 1 - 3                    00:00-24:00
    monday 2 - friday 4             03:00-04:00
    2027-01-01 - 2027-01-07 / 2     08:00-18:00
    february 1 - 3 / 2              09:00-10:00
    day 20 - -1                     11:00-12:00
}
