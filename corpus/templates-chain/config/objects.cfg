# Templates used through several levels, with local values overriding
# inherited ones.

# Hosts: site-defaults -> linux-host -> web-host -> alpha.
define host {
    name                    site-defaults
    register                0
    check_command           check_dummy!0
    max_check_attempts      5
    check_interval          10
    retry_interval          2
    check_period            always
    notification_period     always
    notification_interval   120
    contacts                ops
    notes                   set in site-defaults
}

define host {
    name                    linux-host
    use                     site-defaults
    register                0
    max_check_attempts      4
    notes_url               https://example.test/linux
}

define host {
    name                    web-host
    use                     linux-host
    register                0
    check_interval          3
    action_url              https://example.test/web
}

define host {
    use                     web-host
    host_name               alpha
    address                 192.0.2.10
    max_check_attempts      2
}

# A registered host that is also a template. gamma takes its values from it.
define host {
    name                    beta-as-template
    use                     linux-host
    host_name               beta
    alias                   Beta server
    address                 192.0.2.11
    display_name            Beta
}

define host {
    use                     beta-as-template
    host_name               gamma
    address                 192.0.2.12
}

# Services: base-service (common.cfg) -> slow-service -> Disk.
define service {
    name                    slow-service
    use                     base-service
    register                0
    check_interval          30
    retry_interval          5
}

define service {
    use                     slow-service
    host_name               alpha
    service_description     Disk
    retry_interval          10
}

# Contacts: base-contact (common.cfg) -> pager-contact -> oncall.
define contact {
    name                            pager-contact
    use                             base-contact
    register                        0
    pager                           +1-555-0100
    service_notification_options    c
}

define contact {
    use             pager-contact
    contact_name    oncall
    email           oncall@example.test
}

# A timeperiod and a command cannot be seen to inherit in the dump unless
# they are registered, so one of each is built from a template.
define timeperiod {
    name            weekday-template
    register        0
    monday          09:00-17:00
    tuesday         09:00-17:00
    wednesday       09:00-17:00
    thursday        09:00-17:00
    friday          09:00-17:00
}

define timeperiod {
    use             weekday-template
    timeperiod_name workhours
    alias           Working hours
    friday          09:00-12:00
}

define command {
    name            command-template
    register        0
    command_line    /usr/lib/checkd-test/check_dummy 0
}

define command {
    use             command-template
    command_name    check_from_template
}
