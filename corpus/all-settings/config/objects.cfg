# Every documented setting of a host, service and contact, each given a
# value that is not the default, so the dump shows how each one is written.

define timeperiod {
    timeperiod_name workhours
    alias           Working hours
    monday          09:00-17:00
}

define contactgroup {
    contactgroup_name   cg-admins
    members             ops
}

define hostgroup {
    hostgroup_name  hg-full
}

define servicegroup {
    servicegroup_name   sg-full
}

define host {
    use         base-host
    host_name   upstream
    address     192.0.2.1
}

define host {
    host_name                       full
    alias                           Host with every setting
    display_name                    Full host
    address                         192.0.2.10
    parents                         upstream
    hourly_value                    7
    hostgroups                      hg-full
    check_command                   check_dummy!1!two words
    check_timeout                   17
    initial_state                   d
    max_check_attempts              9
    check_interval                  2.5
    retry_interval                  0.5
    active_checks_enabled           0
    passive_checks_enabled          0
    check_period                    workhours
    obsess_over_host                0
    check_freshness                 1
    freshness_threshold             600
    event_handler                   check_dummy!2
    event_handler_enabled           0
    low_flap_threshold              12.5
    high_flap_threshold             37.5
    flap_detection_enabled          0
    flap_detection_options          o,d
    process_perf_data               0
    retain_status_information       0
    retain_nonstatus_information    0
    contacts                        ops
    contact_groups                  cg-admins
    notification_interval           90
    first_notification_delay        15
    notification_period             workhours
    notification_options            d,u,r,f,s
    notifications_enabled           0
    stalking_options                o,d,u
    notes                           Host notes
    notes_url                       https://example.test/notes/$HOSTNAME$
    action_url                      https://example.test/action/$HOSTNAME$
    icon_image                      server.png
    icon_image_alt                  A server
    vrml_image                      server.wrl
    statusmap_image                 server.gd2
    2d_coords                       120,45
    3d_coords                       1.5,2.5,3.5
    _ASSET_TAG                      A-0042
}

define service {
    host_name                       full
    service_description             Every setting
    display_name                    Full service
    parents                         Plain
    hourly_value                    3
    servicegroups                   sg-full
    is_volatile                     1
    check_command                   check_dummy!1!two words
    check_timeout                   23
    initial_state                   c
    max_check_attempts              8
    check_interval                  1.5
    retry_interval                  0.25
    active_checks_enabled           0
    passive_checks_enabled          0
    check_period                    workhours
    obsess_over_service             0
    check_freshness                 1
    freshness_threshold             900
    event_handler                   check_dummy!2
    event_handler_enabled           0
    low_flap_threshold              10.5
    high_flap_threshold             30.25
    flap_detection_enabled          0
    flap_detection_options          o,w,c
    process_perf_data               0
    retain_status_information       0
    retain_nonstatus_information    0
    notification_interval           75
    first_notification_delay        10
    notification_period             workhours
    notification_options            w,u,c,r,f,s
    notifications_enabled           0
    contacts                        ops
    contact_groups                  cg-admins
    stalking_options                o,w,u,c
    notes                           Service notes
    notes_url                       https://example.test/notes/$SERVICEDESC$
    action_url                      https://example.test/action/$SERVICEDESC$
    icon_image                      service.png
    icon_image_alt                  A service
    _RUNBOOK                        https://example.test/runbook
}

define service {
    use                     base-service
    host_name               full
    service_description     Plain
}

define contact {
    contact_name                    full
    alias                           Contact with every setting
    contactgroups                   cg-admins
    minimum_value                   4
    host_notifications_enabled      0
    service_notifications_enabled   0
    host_notification_period        workhours
    service_notification_period     always
    host_notification_options       d,u,r,f,s
    service_notification_options    w,u,c,r,f,s
    host_notification_commands      notify_dummy,check_dummy
    service_notification_commands   check_dummy,notify_dummy
    email                           full@example.test
    pager                           +1-555-0101
    address1                        first
    address2                        second
    address3                        third
    address4                        fourth
    address5                        fifth
    address6                        sixth
    can_submit_commands             0
    retain_status_information       0
    retain_nonstatus_information    0
    _TEAM                           platform
}

# Option letters given one at a time, to see how each is written back.
define host {
    use                     base-host
    host_name               opt-none
    address                 192.0.2.20
    notification_options    n
    flap_detection_options  n
    stalking_options        n
    initial_state           u
}

define host {
    use                     base-host
    host_name               opt-all
    address                 192.0.2.21
    notification_options    a
    flap_detection_options  a
    stalking_options        a
    initial_state           o
}

define host {
    use                     base-host
    host_name               opt-single
    address                 192.0.2.22
    notification_options    s
    flap_detection_options  u
    stalking_options        d
}

define service {
    use                     base-service
    host_name               opt-none
    service_description     Options none
    notification_options    n
    flap_detection_options  n
    stalking_options        n
    initial_state           w
}

define service {
    use                     base-service
    host_name               opt-all
    service_description     Options all
    notification_options    a
    flap_detection_options  a
    stalking_options        a
    initial_state           u
}

# Number formats: no leading zero, a trailing dot, a plus sign, many digits.
define service {
    use                     base-service
    host_name               opt-single
    service_description     Number formats
    check_interval          .5
    retry_interval          2.
    notification_interval   +7
    low_flap_threshold      3.14159265358979
    first_notification_delay    1e1
    max_check_attempts      007
}
