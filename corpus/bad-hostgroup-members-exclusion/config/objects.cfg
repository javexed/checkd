# "!" in hostgroup_members. Naemon takes "!hg-web" as a group name.

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.10
}

define host {
    use         base-host
    host_name   beta
    address     192.0.2.11
}

define hostgroup {
    hostgroup_name  hg-web
    members         alpha
}

define hostgroup {
    hostgroup_name  hg-all-minus-web
    members         *
    hostgroup_members   !hg-web
}
