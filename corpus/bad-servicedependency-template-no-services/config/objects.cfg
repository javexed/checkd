# A service dependency that names no service on either side. It is not
# taken for a template because it has a template name.

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

define service {
    use                     base-service
    host_name               alpha
    service_description     ping
}

define servicedependency {
    name                            dependency-defaults
    notification_failure_criteria   c
}
