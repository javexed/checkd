# use_regexp_matching=1. The docs say a name is then treated as a regular
# expression only if it contains "*", "?", "+" or "\.".
# webcam is here to show what a pattern picks up beyond the web-N hosts.

define host {
    use         base-host
    host_name   web-1
    address     192.0.2.10
}

define host {
    use         base-host
    host_name   web-2
    address     192.0.2.11
}

define host {
    use         base-host
    host_name   web-10
    address     192.0.2.12
}

define host {
    use         base-host
    host_name   db-1
    address     192.0.2.13
}

define host {
    use         base-host
    host_name   db-2
    address     192.0.2.14
}

define host {
    use         base-host
    host_name   webcam
    address     192.0.2.15
}

define host {
    use         base-host
    host_name   mail.example.test
    address     192.0.2.16
}

define hostgroup {
    hostgroup_name  hg-web
    members         web-1,web-2,web-10
}

define hostgroup {
    hostgroup_name  hg-db
    members         db-1,db-2
}

# Looks like a shell wildcard. Read as a regular expression it means "web"
# and then any number of "-".
define service {
    use                     base-service
    host_name               web-*
    service_description     Star suffix
}

define service {
    use                     base-service
    host_name               web-?
    service_description     Question mark
}

# A real regular expression, anchored.
define service {
    use                     base-service
    host_name               ^db-[0-9]+$
    service_description     Anchored
}

# A pattern that is not anchored. Does "eb-1" match web-1 and web-10?
define service {
    use                     base-service
    host_name               eb-1.*
    service_description     Unanchored
}

# A host name that contains a dot, used as a plain name.
define service {
    use                     base-service
    host_name               mail.example.test
    service_description     Dotted name
}

# Host groups by pattern.
define service {
    use                     base-service
    hostgroup_name          hg-.*
    service_description     Group pattern
}

# A pattern with an exclusion.
define service {
    use                     base-service
    host_name               web-.*,!web-10
    service_description     Pattern minus one
}

# Patterns in group members.
define hostgroup {
    hostgroup_name  hg-first-of-each
    members         .*-1$
}

define servicegroup {
    servicegroup_name   sg-stars
    members             web-.*,Star.*
}

# Service descriptions by pattern in an escalation.
define serviceescalation {
    host_name               web-1
    service_description     ^(Star|Question).*
    contacts                ops
    first_notification      2
    last_notification       0
}
