# Settings given twice, together with templates, `+` and `null`.

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

define host {
    use             base-host
    host_name       beta
    address         192.0.2.2
}

define host {
    use             base-host
    host_name       gamma
    address         192.0.2.3
}

define host {
    use             base-host
    host_name       delta
    address         192.0.2.4
}

define hostgroup {
    name            one-member
    register        0
    members         alpha
}

# Its own two lines are added together. The template's line is replaced.
define hostgroup {
    use             one-member
    hostgroup_name  own-twice
    members         beta
    members         gamma
}

# A `+` on the first line makes the sum of both lines add to the template.
define hostgroup {
    use             one-member
    hostgroup_name  plus-on-first-line
    members         +beta
    members         gamma
}

# A line that says `null` adds nothing and takes nothing away.
define hostgroup {
    hostgroup_name  null-second
    members         beta
    members         null
}

define hostgroup {
    hostgroup_name  null-first
    members         null
    members         beta
}

# A template's two lines are inherited as their sum.
define hostgroup {
    name            two-lines
    register        0
    members         alpha
    members         beta
}

define hostgroup {
    use             two-lines
    hostgroup_name  inherits-two-lines
}

define hostgroup {
    use             two-lines
    hostgroup_name  adds-to-two-lines
    members         +delta
}

# `use` twice: the later line counts, so nothing comes from `first-notes`.
define host {
    name            first-notes
    register        0
    notes           From first-notes
    notes_url       https://first.example/
}

define host {
    name            second-notes
    register        0
    notes           From second-notes
    action_url      https://second.example/
}

define host {
    host_name       epsilon
    address         192.0.2.5
    use             first-notes
    use             second-notes,base-host
}
