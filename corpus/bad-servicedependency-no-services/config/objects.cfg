# A service dependency that names no service on either side. A host
# dependency like this is accepted (`hostdependency-one-sided`).

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

define service {
    use                     base-service
    host_name               alpha
    service_description     ping
}

define servicedependency {
    notification_failure_criteria   c
}
