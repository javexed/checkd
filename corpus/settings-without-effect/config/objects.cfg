# Settings of older Nagios versions that Naemon still accepts and does
# nothing with. `parallelize_check` is accepted on a service only
# (`bad-parallelize-check-on-host`).

define host {
    use                         base-host
    host_name                   alpha
    address                     192.0.2.1
    failure_prediction_enabled  1
}

define service {
    use                         base-service
    host_name                   alpha
    service_description         ping
    failure_prediction_enabled  0
    parallelize_check           1
}

# A value that is no number is accepted too.
define service {
    use                         base-service
    host_name                   alpha
    service_description         disk
    failure_prediction_enabled  perhaps
    parallelize_check           sometimes
}
