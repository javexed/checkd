# Does "!" take a host or a service out of a dependency? Each dependency
# has its own failure criteria, so the dump shows which one made an entry.

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.10
}

define host {
    use         base-host
    host_name   beta
    address     192.0.2.11
}

define host {
    use         base-host
    host_name   gamma
    address     192.0.2.12
}

define service {
    use                     base-service
    host_name               alpha,beta,gamma
    service_description     Ping
}

define service {
    use                     base-service
    host_name               alpha,beta
    service_description     Load
}

define hostgroup {
    hostgroup_name  hg-all
    members         alpha,beta,gamma
}

define hostgroup {
    hostgroup_name  hg-ab
    members         alpha,beta
}

# d: "!" in the dependent host list, no host group.
define hostdependency {
    host_name                       alpha
    dependent_host_name             beta,gamma,!gamma
    notification_failure_criteria   d
}

# u: "!" in the dependent host group list.
define hostdependency {
    host_name                       alpha
    dependent_hostgroup_name        hg-all,!hg-ab
    execution_failure_criteria      u
}

# p: "!" in the master host list, no host group.
define hostdependency {
    host_name                       alpha,beta,!beta
    dependent_host_name             gamma
    notification_failure_criteria   p
}

# u (notification): a dependent host group, and "!" in the dependent host
# list.
define hostdependency {
    host_name                       alpha
    dependent_hostgroup_name        hg-all
    dependent_host_name             !alpha,!beta
    notification_failure_criteria   u
}

# c: "!" in the dependent host list of a service dependency.
define servicedependency {
    host_name                       alpha
    service_description             Ping
    dependent_host_name             beta,gamma,!gamma
    dependent_service_description   Ping
    execution_failure_criteria      c
}

# w: a dependent host group, and "!" in the dependent host list.
define servicedependency {
    host_name                       alpha
    service_description             Load
    dependent_hostgroup_name        hg-all
    dependent_host_name             !alpha
    dependent_service_description   Ping
    execution_failure_criteria      w
}

# u: no dependent host, and "!" in the dependent description list.
define servicedependency {
    host_name                       alpha
    service_description             Ping
    dependent_service_description   *,!Ping
    execution_failure_criteria      u
}

# o: "!" in the master host list.
define servicedependency {
    host_name                       alpha,beta,!beta
    service_description             Ping
    dependent_host_name             gamma
    dependent_service_description   Ping
    execution_failure_criteria      o
}
