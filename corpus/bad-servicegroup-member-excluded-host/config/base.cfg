# Hosts, groups and services shared by the cases on lists of names.
# The definition under test is in objects.cfg.

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

define host {
    use             base-host
    host_name       beta
    address         192.0.2.2
}

define host {
    use             base-host
    host_name       gamma
    address         192.0.2.3
}

define hostgroup {
    hostgroup_name  web
    members         alpha
}

define hostgroup {
    hostgroup_name  db
    members         beta
}

# A group with no members.
define hostgroup {
    hostgroup_name  spare
}

define service {
    use                 base-service
    host_name           alpha,beta,gamma
    service_description ping
}

define service {
    use                 base-service
    host_name           alpha,beta,gamma
    service_description load
}

define servicegroup {
    servicegroup_name   sg-ping
    members             alpha,ping
}

define servicegroup {
    servicegroup_name   sg-load
    members             beta,load
}

define servicegroup {
    servicegroup_name   sg-spare
}

define contact {
    use             base-contact
    contact_name    second
}

define contactgroup {
    contactgroup_name   cg-day
    members             ops
}

define contactgroup {
    contactgroup_name   cg-night
    members             second
}

define contactgroup {
    contactgroup_name   cg-spare
}
