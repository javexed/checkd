# The lines of `members` are added together as text. A `+` at the start of
# the second line is then no longer at the start of the value, and is read
# as part of a host name.

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

define host {
    use             base-host
    host_name       beta
    address         192.0.2.2
}

define hostgroup {
    name            one-member
    register        0
    members         alpha
}

define hostgroup {
    use             one-member
    hostgroup_name  plus-on-second-line
    members         alpha
    members         +beta
}
