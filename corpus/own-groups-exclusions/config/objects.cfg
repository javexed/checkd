# The groups an object joins with its own `hostgroups`, `servicegroups`
# or `contactgroups` setting form a list like any other: a `!` takes a
# group out again. The docs do not say so.

# Joins web only.
define host {
    use           base-host
    host_name     delta
    address       192.0.2.4
    hostgroups    web,db,!db
}

# Joins spare. The excluded group does not have to be in the list.
define host {
    use           base-host
    host_name     epsilon
    address       192.0.2.5
    hostgroups    spare,!web
}

define service {
    use                    base-service
    host_name              gamma
    service_description    disk
    servicegroups          sg-ping,sg-load,!sg-load
}

define contact {
    use              base-contact
    contact_name     third
    contactgroups    cg-day,cg-night,!cg-night
}
