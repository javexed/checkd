# Extinfo definitions have templates of their own, and "register 0" does
# not switch one off.

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.1
}

define host {
    use         base-host
    host_name   beta
    address     192.0.2.2
}

define host {
    use         base-host
    host_name   gamma
    address     192.0.2.3
    hostgroups  db
}

define hostgroup {
    hostgroup_name  web
    members         alpha,beta
}

define hostgroup {
    hostgroup_name  db
}

define hostgroup {
    hostgroup_name  mixed
    members         alpha,gamma
}

define service {
    use                     base-service
    host_name               alpha,beta
    service_description     ping
}

define service {
    use                     base-service
    host_name               alpha
    service_description     ssh
}

define hostextinfo {
    name        ext-values
    register    0
    notes       from the template
    icon_image  template.png
}

define hostextinfo {
    use         ext-values
    host_name   alpha
    icon_image  mine.png
}

# A template that names a host is applied to that host as well.
define hostextinfo {
    name        ext-for-beta
    host_name   beta
    notes_url   http://ext.example/beta
}

define hostextinfo {
    use         ext-for-beta
    hostgroup_name  db
    action_url  http://ext.example/db
}

# "register 0" with a host: applied all the same.
define hostextinfo {
    host_name       beta
    icon_image_alt  not registered
    register        0
}

define hostextinfo {
    name            ext-off
    host_name       gamma
    icon_image_alt  named and not registered
    register        0
}

define serviceextinfo {
    name        service-ext-values
    register    0
    host_name   alpha
    notes       from the service template
}

define serviceextinfo {
    use                     service-ext-values
    service_description     ping
    icon_image              mine.png
}

define serviceextinfo {
    host_name               alpha
    service_description     ssh
    notes                   not registered
    register                0
}
