# Host and service escalations, written with lists, groups and wildcards.

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.10
}

define host {
    use         base-host
    host_name   beta
    address     192.0.2.11
}

define host {
    use         base-host
    host_name   gamma
    address     192.0.2.12
}

define service {
    use                     base-service
    host_name               alpha,beta,gamma
    service_description     Ping
}

define service {
    use                     base-service
    host_name               alpha,beta
    service_description     Load
}

define contact {
    use             base-contact
    contact_name    manager
}

define contactgroup {
    contactgroup_name   cg-managers
    members             manager
}

define hostgroup {
    hostgroup_name  hg-web
    members         alpha,beta
}

define servicegroup {
    servicegroup_name   sg-load
    members             alpha,Load,beta,Load
}

# Every setting given.
define hostescalation {
    host_name               alpha,beta
    contacts                manager
    contact_groups          cg-managers
    first_notification      3
    last_notification       6
    notification_interval   20
    escalation_period       always
    escalation_options      d,r
}

define hostescalation {
    hostgroup_name          hg-web
    contact_groups          cg-managers
    first_notification      7
    last_notification       0
}

define hostescalation {
    host_name               *
    contacts                manager
    first_notification      10
    last_notification       12
    escalation_options      u
}

define hostescalation {
    host_name               alpha,beta,gamma,!beta
    contacts                manager
    first_notification      20
    last_notification       21
}

# Every setting given.
define serviceescalation {
    host_name               alpha
    service_description     Ping,Load
    contacts                manager
    contact_groups          cg-managers
    first_notification      3
    last_notification       6
    notification_interval   20
    escalation_period       always
    escalation_options      w,c,r
}

define serviceescalation {
    host_name               gamma
    service_description     *
    contacts                manager
    first_notification      7
    last_notification       0
    escalation_options      u
}

define serviceescalation {
    servicegroup_name       sg-load
    contact_groups          cg-managers
    first_notification      10
    last_notification       12
}

define serviceescalation {
    hostgroup_name          hg-web
    service_description     Ping
    contacts                manager
    first_notification      20
    last_notification       21
}

# Interval 0: the escalation notifies once.
define serviceescalation {
    host_name               beta
    service_description     Ping
    contacts                manager
    first_notification      30
    last_notification       0
    notification_interval   0
}
