# Ways to write the first and the last line of a definition.

# No space before the brace.
define host{
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

# Several spaces, and a tab.
define   host    {
    use             base-host
    host_name       beta
    address         192.0.2.2
}

define	host	{
    use             base-host
    host_name       gamma
    address         192.0.2.3
}

# Indented, with the closing brace indented too.
    define host {
        use             base-host
        host_name       delta
        address         192.0.2.4
    }

# A comment after the brace.
define host {   ; the fifth host
    use             base-host
    host_name       epsilon
    address         192.0.2.5
}   ; end of the fifth host

# Text after the opening brace is dropped. Text after the closing brace
# is an error (`bad-text-after-closing-brace`).
define host { host_name not-this-one
    use             base-host
    host_name       zeta
    address         192.0.2.6
}
