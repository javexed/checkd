# Host dependencies that lack the host, the dependent host, or both.
# Naemon accepts each one without a word and makes no dependency of it.

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.1
}

define host {
    use             base-host
    host_name       beta
    address         192.0.2.2
}

define hostdependency {
    dependent_host_name             beta
    notification_failure_criteria   d
}

define hostdependency {
    host_name                       alpha
    notification_failure_criteria   d
}

define hostdependency {
    notification_failure_criteria   d
}

define hostdependency {
    inherits_parent                 1
}

# A complete one, to show what a dependency looks like in the result.
define hostdependency {
    host_name                       alpha
    dependent_host_name             beta
    execution_failure_criteria      u
}
