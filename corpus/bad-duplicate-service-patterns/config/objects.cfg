# A service defined twice for one host, both times by pattern.
# checkd refuses a service defined twice in the same way, so it refuses
# this case. What follows is what Naemon does with it.
#
# Naemon keeps one of the two and warns. Which one depends on the "first
# host" of each definition:
#
#   - on the first host of both definitions the later definition is kept;
#   - on a host that is the first host of one definition only, the other
#     definition is kept;
#   - on every other host the earlier definition is kept.
#
# Every service below is defined twice with the same hosts, so the later
# definition (`notes second`) is kept on the first host and nowhere else.
#
# A pattern gives the hosts or host groups it matches with the last
# defined one first.

define host {
    use             base-host
    host_name       mike
    address         192.0.2.1
}

define host {
    use             base-host
    host_name       alpha
    address         192.0.2.2
}

define host {
    use             base-host
    host_name       zulu
    address         192.0.2.3
}

define host {
    use             base-host
    host_name       echo
    address         192.0.2.4
}

define host {
    use             base-host
    host_name       kilo
    address         192.0.2.5
}

define host {
    use             base-host
    host_name       bravo
    address         192.0.2.6
}

define hostgroup {
    hostgroup_name  plain-one
    members zulu,alpha,mike
}

define hostgroup {
    hostgroup_name  plain-two
    members echo
}

define hostgroup {
    hostgroup_name  made-of-pattern
    members ^[a-m].*
}

define hostgroup {
    hostgroup_name  made-of-mixture
    members kilo,^[a-e].*,zulu
}

# The last defined host that matches.
define service {
    use                     base-service
    host_name ^[a-m].*
    service_description     host-pattern
    notes                   first
}

define service {
    use                     base-service
    host_name ^[a-m].*
    service_description     host-pattern
    notes                   second
}

# A name written before the pattern.
define service {
    use                     base-service
    host_name zulu,^[a-e].*
    service_description     name-then-pattern
    notes                   first
}

define service {
    use                     base-service
    host_name zulu,^[a-e].*
    service_description     name-then-pattern
    notes                   second
}

# A name written after the pattern.
define service {
    use                     base-service
    host_name ^[a-e].*,kilo
    service_description     pattern-then-name
    notes                   first
}

define service {
    use                     base-service
    host_name ^[a-e].*,kilo
    service_description     pattern-then-name
    notes                   second
}

# The last defined group that matches comes first.
define service {
    use                     base-service
    hostgroup_name plain-.*
    service_description     group-pattern
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name plain-.*
    service_description     group-pattern
    notes                   second
}

# The pattern names the group again: no first host.
define service {
    use                     base-service
    hostgroup_name plain-two,plain-.*
    service_description     group-then-pattern
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name plain-two,plain-.*
    service_description     group-then-pattern
    notes                   second
}

# A pattern in `members` adds the last defined host first.
define service {
    use                     base-service
    hostgroup_name made-of-pattern
    service_description     group-of-pattern
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name made-of-pattern
    service_description     group-of-pattern
    notes                   second
}

# Names and a pattern in `members`.
define service {
    use                     base-service
    hostgroup_name made-of-mixture
    service_description     group-of-mixture
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name made-of-mixture
    service_description     group-of-mixture
    notes                   second
}

# Two matching groups.
define service {
    use                     base-service
    hostgroup_name made-of-.*
    service_description     both-pattern-groups
    notes                   first
}

define service {
    use                     base-service
    hostgroup_name made-of-.*
    service_description     both-pattern-groups
    notes                   second
}
