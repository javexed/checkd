# allow_empty_hostgroup_assignment takes any text. Naemon reads the number
# it starts with and takes the setting as on when that is above zero. 2x
# reads as on, so the host dependency on an empty group is dropped and the
# configuration accepted. checkd does the same and warns about the value.
cfg_file=common.cfg
cfg_file=base.cfg
cfg_file=objects.cfg
allow_empty_hostgroup_assignment=2x
