# Two host groups that contain each other.

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.10
}

define host {
    use         base-host
    host_name   beta
    address     192.0.2.11
}

define hostgroup {
    hostgroup_name      hg-a
    members             alpha
    hostgroup_members   hg-b
}

define hostgroup {
    hostgroup_name      hg-b
    members             beta
    hostgroup_members   hg-a
}
