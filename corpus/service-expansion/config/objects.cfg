# One service definition applied to several hosts: host lists, host groups,
# the "*" wildcard and "!" exclusions.

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.10
}

define host {
    use         base-host
    host_name   beta
    address     192.0.2.11
}

define host {
    use         base-host
    host_name   gamma
    address     192.0.2.12
}

define host {
    use         base-host
    host_name   delta
    address     192.0.2.13
}

define host {
    use         base-host
    host_name   epsilon
    address     192.0.2.14
}

define hostgroup {
    hostgroup_name  hg-web
    members         alpha,beta
}

define hostgroup {
    hostgroup_name  hg-db
    members         gamma,delta
}

define hostgroup {
    hostgroup_name  hg-servers
    hostgroup_members   hg-web,hg-db
}

define service {
    use                     base-service
    host_name               gamma,alpha,beta
    service_description     Host list
}

define service {
    use                     base-service
    hostgroup_name          hg-web,hg-db
    service_description     Group list
}

define service {
    use                     base-service
    host_name               *
    service_description     Every host
}

define service {
    use                     base-service
    host_name               alpha,beta,gamma,!beta
    service_description     Hosts minus one
}

define service {
    use                     base-service
    hostgroup_name          hg-servers,!hg-db
    service_description     Groups minus one
}

define service {
    use                     base-service
    host_name               *,!epsilon
    service_description     All but one
}

# Hosts and groups together.
define service {
    use                     base-service
    host_name               epsilon
    hostgroup_name          hg-web
    service_description     Hosts and groups
}

# alpha is named directly and is also in the group.
define service {
    use                     base-service
    host_name               alpha
    hostgroup_name          hg-web
    service_description     Named twice
}

# A group minus one of its hosts.
define service {
    use                     base-service
    host_name               !delta
    hostgroup_name          hg-db
    service_description     Group minus host
}

# The exclusion written before the thing it excludes from.
define service {
    use                     base-service
    host_name               !beta,alpha,beta
    service_description     Exclusion first
}

# A template that carries the host group, used by two services.
define service {
    name                    web-service
    use                     base-service
    register                0
    hostgroup_name          hg-web
}

define service {
    use                     web-service
    service_description     From template
}

define service {
    use                     web-service
    host_name               gamma
    service_description     Template plus host
}
