# The same host and service description defined once by host name and once
# through a host group. The definition that names the host is used on that
# host, whichever comes first, and Naemon gives no warning. This is the
# usual way to give one host of a group its own values, and checkd does the
# same.
#
# Two definitions of the same sort are another matter: see
# `bad-duplicate-service` and the cases beside it.

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.10
}

define host {
    use         base-host
    host_name   beta
    address     192.0.2.11
}

define hostgroup {
    hostgroup_name  hg-web
    members         alpha,beta
}

# A group-wide definition, and a host-specific one with another setting.
# The group one comes first in the file.
define service {
    use                     base-service
    hostgroup_name          hg-web
    service_description     Group then host
    check_interval          10
}

define service {
    use                     base-service
    host_name               alpha
    service_description     Group then host
    check_interval          1
}

# The other order: host-specific first.
define service {
    use                     base-service
    host_name               alpha
    service_description     Host then group
    check_interval          1
}

define service {
    use                     base-service
    hostgroup_name          hg-web
    service_description     Host then group
    check_interval          10
}

define hostgroup {
    hostgroup_name  hg-alpha
    members         alpha
}

# A definition with both settings counts as by host name for the hosts
# that `host_name` names.
define service {
    use                     base-service
    host_name               alpha
    hostgroup_name          hg-alpha
    service_description     Both then group
    check_interval          1
}

define service {
    use                     base-service
    hostgroup_name          hg-web
    service_description     Both then group
    check_interval          10
}

# `host_name *` counts as naming every host.
define service {
    use                     base-service
    hostgroup_name          hg-web
    service_description     Group then star
    check_interval          10
}

define service {
    use                     base-service
    host_name               *
    service_description     Group then star
    check_interval          1
}

# The same, the other way round.
define service {
    use                     base-service
    host_name               *
    service_description     Star then group
    check_interval          1
}

define service {
    use                     base-service
    hostgroup_name          hg-web
    service_description     Star then group
    check_interval          10
}
