# The same host and service description defined more than once, in ways
# that are easy to do by accident with groups.

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.10
}

define host {
    use         base-host
    host_name   beta
    address     192.0.2.11
}

define hostgroup {
    hostgroup_name  hg-web
    members         alpha,beta
}

# A group-wide definition, and a host-specific one with another setting.
# The group one comes first in the file.
define service {
    use                     base-service
    hostgroup_name          hg-web
    service_description     Group then host
    check_interval          10
}

define service {
    use                     base-service
    host_name               alpha
    service_description     Group then host
    check_interval          1
}

# The other order: host-specific first.
define service {
    use                     base-service
    host_name               alpha
    service_description     Host then group
    check_interval          1
}

define service {
    use                     base-service
    hostgroup_name          hg-web
    service_description     Host then group
    check_interval          10
}
