# With `use_regexp_matching` on, `*` is not valid in a list of hosts or
# host groups (`bad-regexp-star-host`). In a host dependency that fault
# drops the dependency and nothing more (`hostdependency-dropped`).

# The one dependency that is made.
define hostdependency {
    host_name                    al.*
    dependent_host_name          gamma
    execution_failure_options    d
}

define hostdependency {
    host_name                    *
    dependent_host_name          gamma
    execution_failure_options    d
}

define hostdependency {
    host_name                    alpha
    dependent_host_name          *,!alpha
    execution_failure_options    d
}

define hostdependency {
    hostgroup_name               *
    dependent_host_name          gamma
    execution_failure_options    d
}
