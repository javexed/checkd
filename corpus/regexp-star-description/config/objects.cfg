# With `use_regexp_matching` on, `*` alone still stands for every service
# description. For hosts, contacts and groups it no longer does
# (`bad-regexp-star-host`). With `use_true_regexp_matching` on as well it
# stops here too (`bad-true-regexp-star-description`).

define serviceescalation {
    host_name                alpha
    service_description      *
    contacts                 ops
    first_notification       1
    last_notification        2
    notification_interval    5
}

define servicedependency {
    host_name                        alpha
    service_description              *
    dependent_host_name              gamma
    dependent_service_description    ping
    execution_failure_options        c
}

define serviceextinfo {
    host_name              beta
    service_description    *
    notes                  For every service of beta
}

define servicegroup {
    servicegroup_name    on-alpha
    members              alpha,*
}
