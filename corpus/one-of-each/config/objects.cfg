# One object of every type, defined in the reverse of the order the dump
# uses, to show the order the dump puts them in.

define hostescalation {
    host_name               alpha
    contacts                ops
    first_notification      2
    last_notification       0
}

define hostdependency {
    host_name                       alpha
    dependent_host_name             beta
    notification_failure_criteria   d
}

define serviceescalation {
    host_name               alpha
    service_description     Ping
    contacts                ops
    first_notification      2
    last_notification       0
}

define servicedependency {
    host_name                       alpha
    service_description             Ping
    dependent_host_name             beta
    dependent_service_description   Ping
    notification_failure_criteria   c
}

define service {
    use                     base-service
    host_name               alpha,beta
    service_description     Ping
}

define host {
    use         base-host
    host_name   beta
    address     192.0.2.11
}

define host {
    use         base-host
    host_name   alpha
    address     192.0.2.10
}

define servicegroup {
    servicegroup_name   sg-one
    members             alpha,Ping
}

define hostgroup {
    hostgroup_name  hg-one
    members         alpha
}

define contactgroup {
    contactgroup_name   cg-one
    members             ops
}
