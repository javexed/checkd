# Failover tests: two hosts and two services whose states follow the
# clock, so that both nodes see the same ones whichever leads.
define command {
    command_name    at
    command_line    /case/plugins/at $ARG1$ $ARG2$
}
define command {
    command_name    n-svc
    command_line    /case/plugins/args n-$HOSTNAME$-$SERVICEDESC$ t=$NOTIFICATIONTYPE$ n=$NOTIFICATIONNUMBER$
}
define command {
    command_name    n-host
    command_line    /case/plugins/args n-$HOSTNAME$ t=$NOTIFICATIONTYPE$ n=$NOTIFICATIONNUMBER$
}
define timeperiod {
    timeperiod_name always
    alias           always
    sunday 00:00-24:00
    monday 00:00-24:00
    tuesday 00:00-24:00
    wednesday 00:00-24:00
    thursday 00:00-24:00
    friday 00:00-24:00
    saturday 00:00-24:00
}
define contact {
    contact_name    ann
    host_notification_period always
    service_notification_period always
    host_notification_commands n-host
    service_notification_commands n-svc
    host_notification_options d,u,r
    service_notification_options w,u,c,r
}
define host {
    host_name       web
    address         192.0.2.30
    check_command   at!web!0
    max_check_attempts 2
    check_interval  2
    retry_interval  1
    check_period    always
    contacts        ann
    notification_period always
    notification_interval 20
}
define host {
    host_name       db
    address         192.0.2.31
    check_command   at!db!0
    max_check_attempts 2
    check_interval  2
    retry_interval  1
    check_period    always
    contacts        ann
    notification_period always
    notification_interval 20
}
define service {
    host_name       web
    service_description http
    check_command   at!web-http!0
    max_check_attempts 2
    check_interval  2
    retry_interval  1
    check_period    always
    contacts        ann
    notification_period always
    notification_interval 20
}
define service {
    host_name       db
    service_description disk
    check_command   at!db-disk!0 20:2
    max_check_attempts 2
    check_interval  2
    retry_interval  1
    check_period    always
    contacts        ann
    notification_period always
    notification_interval 20
}
