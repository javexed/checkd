define command {
    command_name ok
    command_line $USER1$/true
}
define timeperiod {
    timeperiod_name always
    alias always
    sunday 00:00-24:00
    monday 00:00-24:00
    tuesday 00:00-24:00
    wednesday 00:00-24:00
    thursday 00:00-24:00
    friday 00:00-24:00
    saturday 00:00-24:00
}
define host {
    host_name one
    address 192.0.2.1
    check_command ok
    max_check_attempts 1
    check_interval 5
    check_period always
}
define service {
    host_name one
    service_description a
    check_command ok
    max_check_attempts 1
    check_interval 5
    retry_interval 5
    check_period always
}
define service {
    host_name one
    service_description b
    check_command ok
    max_check_attempts 1
    check_interval 5
    retry_interval 5
