# A site for runs/install: the paths docs/install.md names.
cfg_file=/etc/checkd/objects.cfg
resource_file=/etc/checkd/resource.cfg
interval_length=1
log_file=/var/log/checkd/checkd.log
state_retention_file=/var/lib/checkd/retention.dat
retain_state_information=1
check_external_commands=1
command_file=/run/checkd/checkd.cmd
lock_file=/run/checkd/checkd.pid
broker_module=/usr/lib/naemon/naemon-livestatus/livestatus.so /run/checkd/live
