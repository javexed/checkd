# Remote workers: where each check runs is told by its output, which
# names the machine that ran it.
#
#   core1         host group core, kept local: the engine
#   dmz1          host group dmz: pool hostgroup_dmz, served by w1
#   lab1          host group lab: pool hostgroup_lab, served by nobody
#   plain1        no group, and hosts=no: the engine
#   plain1/special  _WORKER pool_x: served by w2
#   plain1/slow     pool service, served by w1 and w2; takes 15 seconds
#   plain1/forbidden  _WORKER pool_x, a program w2 may not run
#   agent1        no group: the engine; its service goes to its agent,
#                 the worker agent1 with pool host_agent1 (checkd-agent)
define command {
    command_name    where
    command_line    /case/plugins/where $ARG1$ $ARG2$
}
define command {
    command_name    outside
    command_line    /bin/echo outside
}
define timeperiod {
    timeperiod_name always
    alias           always
    sunday 00:00-24:00
    monday 00:00-24:00
    tuesday 00:00-24:00
    wednesday 00:00-24:00
    thursday 00:00-24:00
    friday 00:00-24:00
    saturday 00:00-24:00
}
define hostgroup {
    hostgroup_name  core
    alias           core
    members         core1
}
define hostgroup {
    hostgroup_name  dmz
    alias           dmz
    members         dmz1
}
define hostgroup {
    hostgroup_name  lab
    alias           lab
    members         lab1
}
define host {
    name            base
    max_check_attempts 1
    check_interval  5
    retry_interval  5
    check_period    always
    notifications_enabled 0
    register        0
}
define host {
    use             base
    host_name       core1
    address         192.0.2.40
    check_command   where!core1
}
define host {
    use             base
    host_name       dmz1
    address         192.0.2.41
    check_command   where!dmz1
}
define host {
    use             base
    host_name       lab1
    address         192.0.2.42
    check_command   where!lab1
}
define host {
    use             base
    host_name       plain1
    address         192.0.2.43
    check_command   where!plain1
}
define service {
    name            sbase
    max_check_attempts 1
    check_interval  5
    retry_interval  5
    check_period    always
    notifications_enabled 0
    register        0
}
define service {
    use             sbase
    host_name       core1
    service_description ping
    check_command   where!core1-ping
}
define service {
    use             sbase
    host_name       dmz1
    service_description http
    check_command   where!dmz1-http
}
define service {
    use             sbase
    host_name       plain1
    service_description special
    check_command   where!special
    _WORKER         pool_x
}
define service {
    use             sbase
    host_name       plain1
    service_description slow
    check_command   where!slow!15
}
define service {
    use             sbase
    host_name       plain1
    service_description forbidden
    check_command   outside
    _WORKER         pool_x
}
define host {
    use             base
    host_name       agent1
    address         192.0.2.44
    check_command   where!agent1
}
define service {
    use             sbase
    host_name       agent1
    service_description disk
    check_command   where!agent1-disk
}
