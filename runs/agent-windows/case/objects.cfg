# The services of win1 run on its agent, checkd-agent's Windows build
# under Wine. Its host check stays on the engine.
define command {
    command_name    ok
    command_line    /bin/echo OK on the engine
}
define command {
    command_name    direct
    command_line    cmd /c echo OK direct
}
define command {
    command_name    shell
    command_line    echo OK through a shell & exit 1
}
define command {
    command_name    tcp
    command_line    checkd:tcp -H engine -p 4730
}
define command {
    command_name    slow
    command_line    ping -n 30 127.0.0.1
}
define timeperiod {
    timeperiod_name always
    alias           always
    sunday 00:00-24:00
    monday 00:00-24:00
    tuesday 00:00-24:00
    wednesday 00:00-24:00
    thursday 00:00-24:00
    friday 00:00-24:00
    saturday 00:00-24:00
}
define host {
    host_name       win1
    address         192.0.2.50
    check_command   ok
    max_check_attempts 1
    check_interval  5
    check_period    always
    notifications_enabled 0
}
define service {
    name            sbase
    host_name       win1
    max_check_attempts 1
    check_interval  5
    retry_interval  5
    check_period    always
    notifications_enabled 0
    register        0
}
define service {
    use             sbase
    service_description direct
    check_command   direct
}
define service {
    use             sbase
    service_description shell
    check_command   shell
}
define service {
    use             sbase
    service_description tcp
    check_command   tcp
}
define service {
    use             sbase
    service_description slow
    check_command   slow
}
