# A parent that was checked a few seconds before its child goes down:
# is it checked again, and when? Host q is the parent of c3 and c2. c3
# goes down first, which has q checked on demand; c2 goes down a few
# seconds later, while q's result is still younger than the cache horizon
# (15 s). See runs/README.md, Open, and two-parents.
define host {
 use h
 host_name q
 address 192.0.2.1
 check_interval 60
 check_command at!q!0
}
define host {
 use h
 host_name c3
 address 192.0.2.1
 check_interval 5
 check_command at!c3!0 14:2 50:0
 parents q
}
define host {
 use h
 host_name c2
 address 192.0.2.1
 check_interval 5
 check_command at!c2!0 22:2 55:0
 parents q
}
