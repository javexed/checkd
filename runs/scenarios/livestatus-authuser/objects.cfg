# What a Livestatus query's AuthUser may see. Written for this project;
# the checks are the scripted plugins of runs/lib/plugins.
#
#   ann  contact of the host app, and of the services web/disk, app/proc
#   bob  contact of the host web
#   cat  contact of the services db/query and app/proc
#   dan  in the contact group dbas: the host db and the service db/disk
#   eve  contact of the host pas, which is never checked
#   (ghost, in the queries only, is no contact at all)
#
# web/http names no contact of its own.
define command {
    command_name    auat
    command_line    /case/plugins/at $ARG1$ $ARG2$
}
define command {
    command_name    aunote
    command_line    /case/plugins/args note-$CONTACTNAME$
}
define timeperiod {
    timeperiod_name aualways
    alias           always
    sunday 00:00-24:00
    monday 00:00-24:00
    tuesday 00:00-24:00
    wednesday 00:00-24:00
    thursday 00:00-24:00
    friday 00:00-24:00
    saturday 00:00-24:00
}
define contact {
    name            auc
    register        0
    host_notification_period aualways
    service_notification_period aualways
    host_notification_commands aunote
    service_notification_commands aunote
}
define contact {
    use             auc
    contact_name    ann
}
define contact {
    use             auc
    contact_name    bob
}
define contact {
    use             auc
    contact_name    cat
}
define contact {
    use             auc
    contact_name    dan
}
define contact {
    use             auc
    contact_name    eve
}
define contactgroup {
    contactgroup_name dbas
    alias           Database people
    members         dan
}
define host {
    name            auh
    register        0
    max_check_attempts 1
    check_interval  1
    retry_interval  1
    check_period    aualways
    notification_period aualways
    notification_interval 0
}
define service {
    name            aus
    register        0
    max_check_attempts 1
    check_interval  1
    retry_interval  1
    check_period    aualways
    notification_period aualways
    notification_interval 0
}
define host {
    use             auh
    host_name       web
    address         192.0.2.60
    check_command   auat!web!0
    contacts        bob
}
define host {
    use             auh
    host_name       db
    address         192.0.2.61
    check_command   auat!db!0
    contact_groups  dbas
}
define host {
    use             auh
    host_name       app
    address         192.0.2.62
    check_command   auat!app!0 9:1
    contacts        ann
}
define service {
    use             aus
    host_name       web
    service_description http
    check_command   auat!web-http!0 6:2
}
define service {
    use             aus
    host_name       web
    service_description disk
    check_command   auat!web-disk!0
    contacts        ann
}
define service {
    use             aus
    host_name       db
    service_description query
    check_command   auat!db-query!0 7:1
    contacts        cat
}
define service {
    use             aus
    host_name       db
    service_description disk
    check_command   auat!db-disk!0
    contact_groups  dbas
}
define service {
    use             aus
    host_name       app
    service_description proc
    check_command   auat!app-proc!0
    contacts        ann,cat
}
# A host that is never checked: its state is what is submitted for it.
define host {
    use             auh
    host_name       pas
    address         192.0.2.63
    check_command   auat!pas!0
    active_checks_enabled 0
    passive_checks_enabled 1
    contacts        eve
}
define hostgroup {
    hostgroup_name  front
    alias           front
    members         web
}
define hostgroup {
    hostgroup_name  mixed
    alias           mixed
    members         web,db
}
define hostgroup {
    hostgroup_name  every
    alias           every
    members         web,db,app
}
define servicegroup {
    servicegroup_name disks
    alias           disks
    members         web,disk,db,disk
}
define servicegroup {
    servicegroup_name queries
    alias           queries
    members         db,query
}
define servicegroup {
    servicegroup_name procs
    alias           procs
    members         app,proc,db,query
}
