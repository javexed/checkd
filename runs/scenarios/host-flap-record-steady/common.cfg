define command {
    command_name    seq
    command_line    /case/plugins/seq $ARG1$ $ARG2$
}
define command {
    command_name    at
    command_line    /case/plugins/at $ARG1$ $ARG2$
}
define timeperiod {
    timeperiod_name always
    alias           always
    sunday 00:00-24:00
    monday 00:00-24:00
    tuesday 00:00-24:00
    wednesday 00:00-24:00
    thursday 00:00-24:00
    friday 00:00-24:00
    saturday 00:00-24:00
}
define contact {
    contact_name    ops
    host_notifications_enabled 0
    service_notifications_enabled 0
    host_notification_period always
    service_notification_period always
    host_notification_commands seq
    service_notification_commands seq
}
define host {
    name            h
    register        0
    max_check_attempts 3
    check_interval  5
    retry_interval  2
    check_period    always
    contacts        ops
    notification_period always
}
define service {
    name            s
    register        0
    max_check_attempts 3
    check_interval  4
    retry_interval  1
    check_period    always
    contacts        ops
    notification_period always
}
define command {
    command_name    args
    command_line    /case/plugins/args $ARG1$ $ARG2$
}
define command {
    command_name    raw
    command_line    /case/plugins/raw $ARG1$ $ARG2$ $ARG3$ $ARG4$
}
define command {
    command_name    eh-svc
    command_line    /case/plugins/args eh-$HOSTNAME$-$SERVICEDESC$ $SERVICESTATE$ $SERVICESTATETYPE$ $SERVICEATTEMPT$
}
define command {
    command_name    eh-host
    command_line    /case/plugins/args eh-$HOSTNAME$ $HOSTSTATE$ $HOSTSTATETYPE$ $HOSTATTEMPT$
}
define command {
    command_name    geh-svc
    command_line    /case/plugins/args geh-$HOSTNAME$-$SERVICEDESC$ $SERVICESTATE$ $SERVICESTATETYPE$ $SERVICEATTEMPT$
}
define command {
    command_name    geh-host
    command_line    /case/plugins/args geh-$HOSTNAME$ $HOSTSTATE$ $HOSTSTATETYPE$ $HOSTATTEMPT$
}
