define host {
 use h
 host_name a
 address 192.0.2.1
 check_interval 5
 check_command at!a!0 10:2 20:0 30:2 40:0 50:2 60:0
max_check_attempts 1
}
define service {
 use s
 host_name a
 service_description s
 check_interval 1
 check_command seq!a-s!0

}
define command {
 command_name spy1
 command_line /case/plugins/args spy1 st=$HOSTSTATEID:a$ ty=$HOSTSTATETYPE:a$ at=$HOSTATTEMPT:a$ pc=$HOSTPERCENTCHANGE:a$
}
define host {
 use h
 host_name z
 address 192.0.2.1
 check_interval 0
 check_command at!z!0

}
define service {
 use s
 host_name z
 service_description spy
 check_interval 1
 check_command spy1

}
