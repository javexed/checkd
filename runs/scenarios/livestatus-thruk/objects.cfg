# Objects for recording what Thruk asks Livestatus. Written for this
# project; the checks are the scripted plugins of runs/lib/plugins.
define command {
    command_name    lsat
    command_line    /case/plugins/at $ARG1$ $ARG2$
}
define command {
    command_name    lsseq
    command_line    /case/plugins/seq $ARG1$ $ARG2$
}
define timeperiod {
    timeperiod_name lsalways
    alias           always
    sunday 00:00-24:00
    monday 00:00-24:00
    tuesday 00:00-24:00
    wednesday 00:00-24:00
    thursday 00:00-24:00
    friday 00:00-24:00
    saturday 00:00-24:00
}
define command {
    command_name    lsnote
    command_line    /case/plugins/args note-$CONTACTNAME$
}
define contact {
    contact_name    ann
    alias           Ann
    host_notification_period lsalways
    service_notification_period lsalways
    host_notification_commands lsnote
    service_notification_commands lsnote
    host_notifications_enabled 0
    service_notifications_enabled 0
}
define contactgroup {
    contactgroup_name ops
    alias           Operations
    members         ann
}
define host {
    name            lsh
    register        0
    max_check_attempts 2
    check_interval  1
    retry_interval  1
    check_period    lsalways
    notification_period lsalways
    contact_groups  ops
}
define service {
    name            lss
    register        0
    max_check_attempts 2
    check_interval  1
    retry_interval  1
    check_period    lsalways
    notification_period lsalways
    contact_groups  ops
}
define host {
    use lsh
    host_name web
    alias Web server
    address 192.0.2.10
    check_command lsat!web!0
    hostgroups www
}
define host {
    use lsh
    host_name db
    alias Database
    address 192.0.2.11
    check_command lsat!db!0 20:2
    hostgroups backend
}
define host {
    use lsh
    host_name app
    address 192.0.2.12
    parents web
    check_command lsat!app!0
    hostgroups backend
}
define hostgroup {
    hostgroup_name www
    alias Web
}
define hostgroup {
    hostgroup_name backend
    alias Backend
}
define service {
    use lss
    host_name web
    service_description http
    check_command lsseq!web-http!0 1 2 0
    servicegroups user-facing
}
define service {
    use lss
    host_name web
    service_description disk
    check_command lsat!web-disk!1
}
define service {
    use lss
    host_name db
    service_description query
    check_command lsat!db-query!0 10:2
    servicegroups user-facing
}
define service {
    use lss
    host_name app
    service_description api
    check_command lsseq!app-api!3
    servicegroups user-facing
}
define servicegroup {
    servicegroup_name user-facing
    alias User facing
}
