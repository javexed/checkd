define host {
 use h
 host_name a
 address 192.0.2.1
 check_interval 5
 check_command at!a!0 20:2 60:0

}
define service {
 use s
 host_name a
 service_description s
 check_interval 5
 check_command at!a-s!0 20:2 60:0

}
define service {
 use s
 host_name a
 service_description t
 check_interval 5
 check_command at!a-t!0 30:2 60:0

}
define service {
 use s
 host_name a
 service_description u
 check_interval 5
 check_command at!a-u!0

}
