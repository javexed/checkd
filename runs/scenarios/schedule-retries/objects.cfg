define host {
 use h
 host_name a
 address 192.0.2.1
 check_interval 20
 check_command seq!a!2
max_check_attempts 4
 retry_interval 3
}
define host {
 use h
 host_name b
 address 192.0.2.1
 check_interval 0
 check_command at!b!0

}
define service {
 use s
 host_name b
 service_description s
 check_interval 20
 check_command seq!b-s!2
max_check_attempts 4
 retry_interval 3
}
define service {
 use s
 host_name b
 service_description t
 check_interval 20
 check_command seq!b-t!0x2 2x2 0
max_check_attempts 4
 retry_interval 3
}
