define host {
 use h
 host_name a
 address 192.0.2.1
 check_interval 5
 check_command seq!a!0 2x2 0 2 0
 max_check_attempts 1
}
define host {
 use h
 host_name b
 address 192.0.2.1
 check_interval 5
 check_command seq!b!0

}
define service {
 use s
 host_name b
 service_description s
 check_interval 5
 check_command seq!b-s!0 2x2 0 1 2 0
 max_check_attempts 1
}
