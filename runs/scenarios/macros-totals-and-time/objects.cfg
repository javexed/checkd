define command {
 command_name mac4
 command_line /case/plugins/args $ARG1$ 'time=$TIME$' 'date=$DATE$' 'ldt=$LONGDATETIME$' 'sdt=$SHORTDATETIME$' 'timet=$TIMET$' 'pst=$PROCESSSTARTTIME$' 'est=$EVENTSTARTTIME$' 'iv=$ISVALIDTIME:always$' 'nv=$NEXTVALIDTIME:always$' 'iv2=$ISVALIDTIME:never$' 'nv2=$NEXTVALIDTIME:never$' 'iv3=$ISVALIDTIME:always:86400$' 'nv3=$NEXTVALIDTIME:work:86400$' 'iv4=$ISVALIDTIME:nosuch$' 'lsc=$LASTSERVICECHECK$' 'lssc=$LASTSERVICESTATECHANGE$' 'lsok=$LASTSERVICEOK$' 'lsw=$LASTSERVICEWARNING$' 'lscr=$LASTSERVICECRITICAL$' 'lsu=$LASTSERVICEUNKNOWN$' 'lhc=$LASTHOSTCHECK$' 'lhsc=$LASTHOSTSTATECHANGE$' 'lhu=$LASTHOSTUP$' 'lhd=$LASTHOSTDOWN$' 'lhur=$LASTHOSTUNREACHABLE$' 'sct=$SERVICECHECKTYPE$' 'hct=$HOSTCHECKTYPE$' 'snn=$SERVICENOTIFICATIONNUMBER$' 'sack=$SERVICEACKAUTHOR$' 'nt=$NOTIFICATIONTYPE$' 'hpar=$HOSTPARENTS:b$' 'hch=$HOSTCHILDREN$' 'hid=$HOSTNOTIFICATIONID$' 'htz=$HOSTTIMEZONE$' 'sproblem=$SERVICEPROBLEMID:b:t$' 'lspi=$LASTSERVICEPROBLEMID:b:t$' 'sev=$SERVICEEVENTID:b:t$' 'hev=$HOSTEVENTID:b$' 'hpi=$HOSTPROBLEMID:b$'
}
define timeperiod {
 timeperiod_name never
 alias never
}
define timeperiod {
 timeperiod_name work
 alias work
 monday 09:00-17:00
 tuesday 09:00-17:00
 wednesday 09:00-17:00
 thursday 09:00-17:00
 friday 09:00-17:00
}
define hostgroup {
 hostgroup_name hg
 alias The Group
 members a,b
}
define servicegroup {
 servicegroup_name sg
 alias The Services
 members a,m3,b,t
}
define contactgroup {
 contactgroup_name cg
 alias Ops People
 members ops,ann
}
define contact {
 contact_name ann
 alias Ann Example
 email ann@example.test
 host_notifications_enabled 0
 service_notifications_enabled 0
 host_notification_period always
 service_notification_period always
 host_notification_commands seq
 service_notification_commands seq
 _desk D4
}
define host {
 use h
 host_name a
 address 192.0.2.7
 check_interval 20
 check_command at!a!0
}
define host {
 use h
 host_name b
 address 192.0.2.8
 parents a
 check_interval 20
 check_command at!b!2
 _rack R13
}
define service {
 use s
 host_name b
 service_description t
 check_interval 5
 check_command at!b-t!2
}
define service {
 use s
 host_name a
 service_description t
 check_interval 5
 check_command at!a-t!1
}
define service {
 use s
 host_name a
 service_description m3
 check_interval 6
 check_command mac3!sm3
}
define service {
 use s
 host_name a
 service_description m4
 check_interval 6
 check_command mac4!sm4
}
