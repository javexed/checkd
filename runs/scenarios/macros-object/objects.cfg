define hostgroup {
 hostgroup_name hg
 alias The Group
 notes group notes
 members a,b
}
define servicegroup {
 servicegroup_name sg
 alias The Services
 members a,m2,b,t
}
define contactgroup {
 contactgroup_name cg
 alias Ops People
 members ops
}
define host {
 use h
 host_name a
 alias Host A
 display_name Display A
 address 192.0.2.7
 check_interval 20
 check_command mac1!hm1
 notes note for $HOSTNAME$
 notes_url http://example.test/$HOSTNAME$/notes
 action_url http://example.test/$HOSTADDRESS$/act
 _rack R12;a
}
define host {
 use h
 host_name b
 address 192.0.2.8
 check_interval 20
 check_command at!b!2
}
define service {
 use s
 host_name b
 service_description t
 check_interval 5
 check_command at!b-t!2
}
define service {
 use s
 host_name a
 service_description t
 check_interval 5
 check_command at!a-t!1
}
define service {
 use s
 host_name a
 service_description m1
 check_interval 6
 check_command mac1!sm1
}
define service {
 use s
 host_name a
 service_description m2
 display_name Display M2
 check_interval 6
 check_command mac2!sm2
 notes svc note $SERVICEDESC$
 notes_url http://example.test/$SERVICEDESC$
 action_url http://example.test/act/$HOSTNAME$
 _owner team blue
}
define service {
 use s
 host_name a
 service_description m3
 check_interval 6
 check_command mac3!sm3!two words!with\!bang!$HOSTNAME$
 _owner team blue
}
