define command {
 command_name mac3
 command_line /case/plugins/args $ARG1$ 'a1=$ARG1$' 'a2=$ARG2$' 'a3=$ARG3$' 'a4=$ARG4$' 'u1=$USER1$' 'u2=$USER2$' 'u7=$USER7$' 'cv=$_HOSTRACK$' 'cv2=$_SERVICEOWNER$' 'cv3=$_HOSTNOSUCH$' 'unk=$NOSUCHMACRO$' 'dd=$$' 'lone=$ x' 'tup=$TOTALHOSTSUP$' 'tdn=$TOTALHOSTSDOWN$' 'tso=$TOTALSERVICESOK$' 'tsc=$TOTALSERVICESCRITICAL$' 'tsp=$TOTALSERVICEPROBLEMS$' 'ae=$ADMINEMAIL$' 'ap=$ADMINPAGER$' 'mcf=$MAINCONFIGFILE$' 'lf=$LOGFILE$' 'rf=$RESOURCEFILE$' 'tp=$TEMPPATH$' 'od=$HOSTSTATE:b$' 'od2=$SERVICESTATE:b:t$' 'od3=$SERVICESTATE::t$' 'od4=$HOSTADDRESS:nosuch$' 'grp=$HOSTSTATEID:hg:,$' 'cn=$CONTACTNAME$' 'ce=$CONTACTEMAIL:ops$' 'cgm=$CONTACTGROUPMEMBERS:cg$' 'time=$TIME$' 'date=$DATE$' 'ldt=$LONGDATETIME$' 'sdt=$SHORTDATETIME$' 'timet=$TIMET$' 'pst=$PROCESSSTARTTIME$' 'est=$EVENTSTARTTIME$' 'iv=$ISVALIDTIME:always$' 'nv=$NEXTVALIDTIME:always$' 'lsc=$LASTSERVICECHECK$' 'lssc=$LASTSERVICESTATECHANGE$' 'lsok=$LASTSERVICEOK$' 'lscr=$LASTSERVICECRITICAL$' 'lhc=$LASTHOSTCHECK$' 'lhsc=$LASTHOSTSTATECHANGE$' 'lhu=$LASTHOSTUP$' 'lhd=$LASTHOSTDOWN$'
