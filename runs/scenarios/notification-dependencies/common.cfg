}
define command {
    command_name    n-svc
    command_line    /case/plugins/args n-$CONTACTNAME$-$HOSTNAME$-$SERVICEDESC$ t=$NOTIFICATIONTYPE$ s=$SERVICESTATE$ st=$SERVICESTATETYPE$ a=$SERVICEATTEMPT$ n=$NOTIFICATIONNUMBER$ sn=$SERVICENOTIFICATIONNUMBER$ hn=$HOSTNOTIFICATIONNUMBER$ esc=$NOTIFICATIONISESCALATED$ "rcp=$NOTIFICATIONRECIPIENTS$" "au=$NOTIFICATIONAUTHOR$" "co=$NOTIFICATIONCOMMENT$" id=$SERVICENOTIFICATIONID$ dt=$SERVICEDOWNTIME$ hdt=$HOSTDOWNTIME$ "ack=$SERVICEACKAUTHOR$/$SERVICEACKCOMMENT$" "o=$SERVICEOUTPUT$"
}
define command {
    command_name    n-host
    command_line    /case/plugins/args n-$CONTACTNAME$-$HOSTNAME$ t=$NOTIFICATIONTYPE$ s=$HOSTSTATE$ st=$HOSTSTATETYPE$ a=$HOSTATTEMPT$ n=$NOTIFICATIONNUMBER$ hn=$HOSTNOTIFICATIONNUMBER$ esc=$NOTIFICATIONISESCALATED$ "rcp=$NOTIFICATIONRECIPIENTS$" "au=$NOTIFICATIONAUTHOR$" "co=$NOTIFICATIONCOMMENT$" id=$HOSTNOTIFICATIONID$ dt=$HOSTDOWNTIME$ "ack=$HOSTACKAUTHOR$/$HOSTACKCOMMENT$" "o=$HOSTOUTPUT$"
}
