define host {
 use h
 host_name a
 address 192.0.2.1
 check_interval 5
 check_command seq!a!0

}
define service {
 use s
 host_name a
 service_description s
 check_interval 5
 check_command seq!a-s!0 1 2 3 1x3 2x2 3x2 0 2 1 0

}
define service {
 use s
 host_name a
 service_description v
 check_interval 5
 check_command seq!a-v!0 2x4 1x2 0
 is_volatile 1
 max_check_attempts 1
}
define service {
 use s
 host_name a
 service_description w
 check_interval 5
 check_command seq!a-w!0 2x6 1x2 0
 is_volatile 1
}
