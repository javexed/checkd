define host {
 use h
 host_name a
 address 192.0.2.1
 check_interval 5
 check_command seq!a!0 2x5 0 2 0
 event_handler eh-host
}
define host {
 use h
 host_name b
 address 192.0.2.1
 check_interval 5
 check_command seq!b!0

}
define service {
 use s
 host_name b
 service_description s
 check_interval 5
 check_command seq!b-s!0 2x5 0 1 0 1x2 2x4 0
 event_handler eh-svc
}
