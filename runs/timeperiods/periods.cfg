# Timeperiods of every documented form, for the table in ../expected.tsv.
# The dates fall in the span that ../gen asks about: 2027-01-01 to 2028-03-31.

define timeperiod {
    timeperiod_name always
    alias           every day, all day
    sunday          00:00-24:00
    monday          00:00-24:00
    tuesday         00:00-24:00
    wednesday       00:00-24:00
    thursday        00:00-24:00
    friday          00:00-24:00
    saturday        00:00-24:00
}

define timeperiod {
    timeperiod_name work
    alias           office hours
    monday          09:00-17:00
    tuesday         09:00-17:00
    wednesday       09:00-17:00
    thursday        09:00-17:00
    friday          09:00-17:00
}

define timeperiod {
    timeperiod_name nights
    alias           outside nine to five, every day
    sunday          00:00-09:00,17:00-24:00
    monday          00:00-09:00,17:00-24:00
    tuesday         00:00-09:00,17:00-24:00
    wednesday       00:00-09:00,17:00-24:00
    thursday        00:00-09:00,17:00-24:00
    friday          00:00-09:00,17:00-24:00
    saturday        00:00-09:00,17:00-24:00
}

define timeperiod {
    timeperiod_name weekend
    alias           Saturday and Sunday
    saturday        00:00-24:00
    sunday          00:00-24:00
}

define timeperiod {
    timeperiod_name lunch
    alias           the lunch hour on working days
    monday          12:00-13:00
    tuesday         12:00-13:00
    wednesday       12:00-13:00
    thursday        12:00-13:00
    friday          12:00-13:00
}

define timeperiod {
    timeperiod_name empty
    alias           no times at all
}

define timeperiod {
    timeperiod_name multi-range
    alias           three ranges a day
    sunday          00:00-02:00,04:00-06:00,22:00-24:00
    monday          00:00-02:00,04:00-06:00,22:00-24:00
    tuesday         00:00-02:00,04:00-06:00,22:00-24:00
    wednesday       00:00-02:00,04:00-06:00,22:00-24:00
    thursday        00:00-02:00,04:00-06:00,22:00-24:00
    friday          00:00-02:00,04:00-06:00,22:00-24:00
    saturday        00:00-02:00,04:00-06:00,22:00-24:00
}

define timeperiod {
    timeperiod_name over-midnight
    alias           Monday evening into Tuesday morning
    monday          22:00-24:00
    tuesday         00:00-02:00
}

define timeperiod {
    timeperiod_name touching
    alias           two ranges that meet at noon
    sunday          00:00-12:00,12:00-24:00
    monday          00:00-12:00,12:00-24:00
    tuesday         00:00-12:00,12:00-24:00
    wednesday       00:00-12:00,12:00-24:00
    thursday        00:00-12:00,12:00-24:00
    friday          00:00-12:00,12:00-24:00
    saturday        00:00-12:00,12:00-24:00
}

# Calendar dates.

define timeperiod {
    timeperiod_name cal-single
    alias           office hours, and one date with its own hour
    monday          09:00-17:00
    tuesday         09:00-17:00
    wednesday       09:00-17:00
    thursday        09:00-17:00
    friday          09:00-17:00
    2027-03-17      13:00-14:00
}

define timeperiod {
    timeperiod_name cal-span
    alias           eleven days in March 2027
    2027-03-10 - 2027-03-20     09:00-17:00
}

define timeperiod {
    timeperiod_name cal-span-skip
    alias           every third day of March and April 2027
    2027-03-01 - 2027-04-30 / 3     00:00-24:00
}

define timeperiod {
    timeperiod_name cal-skip-open
    alias           every seventh day from a date on
    2027-02-01 / 7  09:00-17:00
}

define timeperiod {
    timeperiod_name cal-far
    alias           one date years ahead
    2029-06-01      00:00-24:00
}

# A date of a month.

define timeperiod {
    timeperiod_name md-single
    alias           one date every year
    march 17        09:00-17:00
}

define timeperiod {
    timeperiod_name md-last
    alias           the last day of February
    february -1     00:00-24:00
}

define timeperiod {
    timeperiod_name md-span
    alias           six days in July
    july 10 - 15    00:00-24:00
}

define timeperiod {
    timeperiod_name md-span-months
    alias           from April into May
    april 10 - may 15       09:00-17:00
}

define timeperiod {
    timeperiod_name md-span-wrap
    alias           over the turn of the year
    december 20 - january 5 00:00-24:00
}

define timeperiod {
    timeperiod_name md-span-skip
    alias           every tenth day of the second quarter
    april 1 - june 30 / 10  00:00-24:00
}

define timeperiod {
    timeperiod_name md-past-end
    alias           dates that some months do not have
    february 30     00:00-24:00
    april 31        09:00-17:00
}

define timeperiod {
    timeperiod_name md-negative-span
    alias           the last three days of March
    march -3 - -1   00:00-24:00
}

# A day of any month.

define timeperiod {
    timeperiod_name day-single
    alias           the first of every month
    day 1           00:00-24:00
}

define timeperiod {
    timeperiod_name day-last
    alias           the last day of every month
    day -1          09:00-17:00
}

define timeperiod {
    timeperiod_name day-span
    alias           the 10th to the 20th
    day 10 - 20     09:00-17:00
}

define timeperiod {
    timeperiod_name day-span-skip
    alias           every fifth day of the first half
    day 1 - 15 / 5  00:00-24:00
}

define timeperiod {
    timeperiod_name day-31
    alias           the 31st
    day 31          00:00-24:00
}

define timeperiod {
    timeperiod_name day-span-wrap
    alias           from the 25th to the 5th
    day 25 - 5      00:00-24:00
}

define timeperiod {
    timeperiod_name day-negative-span
    alias           the last five days of every month
    day -5 - -1     00:00-24:00
}

define timeperiod {
    timeperiod_name day-span-past-end
    alias           from the 20th to a day that some months do not have
    day 20 - 31     00:00-24:00
}

define timeperiod {
    timeperiod_name md-span-past-end
    alias           to a date that February does not have
    february 20 - 30        00:00-24:00
}

define timeperiod {
    timeperiod_name wd-span-past-end
    alias           from the first Monday to a fifth Friday that few months have
    monday 1 - friday 5     00:00-24:00
}

# A weekday of a month.

define timeperiod {
    timeperiod_name wom-last
    alias           the last Thursday of November
    thursday -1 november    00:00-24:00
}

define timeperiod {
    timeperiod_name wom-first
    alias           the first Monday of September
    monday 1 september      09:00-17:00
}

define timeperiod {
    timeperiod_name wom-fifth
    alias           a fifth Monday that February does not have
    monday 5 february       00:00-24:00
}

define timeperiod {
    timeperiod_name wom-minus-fifth
    alias           a fifth Monday from the end that February does not have
    monday -5 february      00:00-24:00
}

define timeperiod {
    timeperiod_name wom-span
    alias           from a Tuesday in April to a Friday in May
    tuesday 1 april - friday 2 may  00:00-24:00
}

define timeperiod {
    timeperiod_name wom-span-skip
    alias           every other day of most of March
    monday 1 march - sunday -1 march / 2    00:00-24:00
}

# A weekday of any month.

define timeperiod {
    timeperiod_name wd-third
    alias           the third Monday
    monday 3        00:00-24:00
}

define timeperiod {
    timeperiod_name wd-last
    alias           the last Friday
    friday -1       09:00-17:00
}

define timeperiod {
    timeperiod_name wd-fifth
    alias           the fifth Wednesday, which few months have
    wednesday 5     00:00-24:00
}

define timeperiod {
    timeperiod_name wd-span
    alias           from the third Monday to the fourth Thursday
    monday 3 - thursday 4   00:00-24:00
}

define timeperiod {
    timeperiod_name wd-span-skip
    alias           every other day from the first Monday to the third Friday
    monday 1 - friday 3 / 2 00:00-24:00
}

# Which line counts when several fit one day.

define timeperiod {
    timeperiod_name precedence
    alias           five kinds of line that all fit 8 March 2027
    monday          09:00-17:00
    monday 2        00:00-06:00
    monday 2 march  06:00-07:00
    day 8           10:00-11:00
    march 8         20:00-21:00
    2027-03-08      22:00-23:00
}

define timeperiod {
    timeperiod_name same-kind-days
    alias           two lines of one kind that fit the 10th
    day 10          09:00-10:00
    day 5 - 15      14:00-15:00
}

define timeperiod {
    timeperiod_name same-kind-dates
    alias           two calendar lines that fit one date
    2027-03-10                  09:00-10:00
    2027-03-05 - 2027-03-15     14:00-15:00
}

define timeperiod {
    timeperiod_name same-kind-days-turned
    alias           the same two lines the other way round
    day 5 - 15      14:00-15:00
    day 10          09:00-10:00
}

define timeperiod {
    timeperiod_name same-kind-three
    alias           three lines of one kind that fit the 10th
    day 8 - 12      06:00-07:00
    day 10          09:00-10:00
    day 5 - 15      14:00-15:00
}

define timeperiod {
    timeperiod_name same-kind-weekdays
    alias           two weekday lines that fit the second Wednesday
    wednesday 2             09:00-10:00
    monday 2 - friday 2     14:00-15:00
}

define timeperiod {
    timeperiod_name day-off
    alias           every day but one, by a date with no time in it
    sunday          00:00-24:00
    monday          00:00-24:00
    tuesday         00:00-24:00
    wednesday       00:00-24:00
    thursday        00:00-24:00
    friday          00:00-24:00
    saturday        00:00-24:00
    december 25     00:00-00:00
}

# Exclusions.

define timeperiod {
    timeperiod_name not-work
    alias           all the time but office hours
    sunday          00:00-24:00
    monday          00:00-24:00
    tuesday         00:00-24:00
    wednesday       00:00-24:00
    thursday        00:00-24:00
    friday          00:00-24:00
    saturday        00:00-24:00
    exclude         work
}

define timeperiod {
    timeperiod_name work-less-lunch
    alias           office hours without the lunch hour
    monday          09:00-17:00
    tuesday         09:00-17:00
    wednesday       09:00-17:00
    thursday        09:00-17:00
    friday          09:00-17:00
    exclude         lunch
}

define timeperiod {
    timeperiod_name excluded-twice
    alias           what a period that excludes leaves out
    sunday          00:00-24:00
    monday          00:00-24:00
    tuesday         00:00-24:00
    wednesday       00:00-24:00
    thursday        00:00-24:00
    friday          00:00-24:00
    saturday        00:00-24:00
    exclude         work-less-lunch
}

define timeperiod {
    timeperiod_name not-work-not-weekend
    alias           two exclusions
    sunday          00:00-24:00
    monday          00:00-24:00
    tuesday         00:00-24:00
    wednesday       00:00-24:00
    thursday        00:00-24:00
    friday          00:00-24:00
    saturday        00:00-24:00
    exclude         work,weekend
}

define timeperiod {
    timeperiod_name nothing-left
    alias           office hours with everything excluded
    monday          09:00-17:00
    tuesday         09:00-17:00
    wednesday       09:00-17:00
    thursday        09:00-17:00
    friday          09:00-17:00
    exclude         always
}

define timeperiod {
    timeperiod_name not-a-date
    alias           all the time but one date of every year
    sunday          00:00-24:00
    monday          00:00-24:00
    tuesday         00:00-24:00
    wednesday       00:00-24:00
    thursday        00:00-24:00
    friday          00:00-24:00
    saturday        00:00-24:00
    exclude         md-single
}
