define command {
    command_name    at
    command_line    /case/plugins/at $ARG1$ $ARG2$
}
define command {
    command_name    n-svc
    command_line    /case/plugins/args n-$CONTACTNAME$-$HOSTNAME$-$SERVICEDESC$ t=$NOTIFICATIONTYPE$ n=$NOTIFICATIONNUMBER$ "ack=$SERVICEACKAUTHOR$" dt=$SERVICEDOWNTIME$
}
define command {
    command_name    n-host
    command_line    /case/plugins/args n-$CONTACTNAME$-$HOSTNAME$ t=$NOTIFICATIONTYPE$ n=$NOTIFICATIONNUMBER$
}
define timeperiod {
    timeperiod_name always
    alias           always
    sunday 00:00-24:00
    monday 00:00-24:00
    tuesday 00:00-24:00
    wednesday 00:00-24:00
    thursday 00:00-24:00
    friday 00:00-24:00
    saturday 00:00-24:00
}
define contact {
    contact_name    ann
    host_notification_period always
    service_notification_period always
    host_notification_commands n-host
    service_notification_commands n-svc
    host_notification_options d,u,r,f,s
    service_notification_options w,u,c,r,f,s
}
define host {
    name            h
    register        0
    max_check_attempts 1
    check_interval  3
    retry_interval  3
    check_period    always
    contacts        ann
    notification_period always
    notification_interval 6
}
define service {
    name            s
    register        0
    max_check_attempts 1
    check_interval  3
    retry_interval  3
    check_period    always
    contacts        ann
    notification_period always
    notification_interval 6
}
define host {
    use h
    host_name a
    address 192.0.2.1
    check_command at!a!0
}
define host {
    use h
    host_name d
    address 192.0.2.2
    check_command at!d!2
}
define service {
    use s
    host_name a
    service_description acked
    check_command at!acked!2
}
define service {
    use s
    host_name a
    service_description down
    check_command at!down!2
}
define service {
    use s
    host_name a
    service_description counted
    check_command at!counted!2
}
define service {
    use s
    host_name a
    service_description quiet
    check_command at!quiet!2
}
