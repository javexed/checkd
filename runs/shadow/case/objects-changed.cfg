# Shadow mode against the reference: hosts and services whose states
# change over the run, on the clock only, so that both engines can run the
# same plugins without one counting the other's calls.
define command {
    command_name    at
    command_line    /case/plugins/at $ARG1$ $ARG2$
}
define timeperiod {
    timeperiod_name always
    alias           always
    sunday 00:00-24:00
    monday 00:00-24:00
    tuesday 00:00-24:00
    wednesday 00:00-24:00
    thursday 00:00-24:00
    friday 00:00-24:00
    saturday 00:00-24:00
}
define host {
    host_name gateway
    address 192.0.2.20
    check_command at!gateway!0
    max_check_attempts 2
    check_interval 5
    retry_interval 2
    check_period always
}
define host {
    host_name store
    address 192.0.2.20
    check_command at!store!0 30:2 60:0
    max_check_attempts 2
    check_interval 5
    retry_interval 2
    check_period always
}
define host {
    host_name edge
    address 192.0.2.20
    check_command at!edge!0 45:2
    max_check_attempts 2
    check_interval 5
    retry_interval 2
    check_period always
}
