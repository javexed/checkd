[package]
name = "checkd-agent"
description = "Runs one host's checks for a checkd engine, over TLS"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The agent is checkd's remote worker on its own: the same source files
# (worker.rs, runner.rs, tls.rs, builtin.rs), without the engine, so that it
# builds for Windows as well as for Linux.

[dependencies]
checkd-core = { path = "../checkd-core" }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "process", "time", "io-util", "sync", "signal", "macros", "net"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Services"] }

[features]
default = ["tls-checks"]
tls-checks = []
