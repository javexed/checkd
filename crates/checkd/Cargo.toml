[package]
name = "checkd"
description = "A Nagios-compatible monitoring engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
checkd-config = { path = "../checkd-config" }
checkd-core = { version = "0.0.0", path = "../checkd-core" }
checkd-livestatus = { version = "0.0.0", path = "../checkd-livestatus" }
libc = "0.2.191"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"], optional = true }
rusqlite = { version = "0.42.0", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "process", "time", "io-util", "sync", "signal", "macros", "net"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"], optional = true }
tokio-postgres-rustls = { version = "0.14.0", optional = true }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"], optional = true }
webpki-roots = { version = "1.0.12", optional = true }

[features]
default = ["tls-checks"]
# TLS for checkd's own checks (`checkd:http -S`, `checkd:cert`), with the
# usual certificate authorities built in. On in a plain build.
tls-checks = ["dep:tokio-rustls", "dep:rustls", "dep:webpki-roots"]
# The optional export of checkd's own metrics and traces to an
# OpenTelemetry collector. Off in a plain build.
otel = ["tokio/net"]
# The PostgreSQL store, with TLS for a database on another machine. Off in
# a plain build, which keeps its state in SQLite.
postgres = ["dep:tokio-postgres", "dep:tokio-postgres-rustls", "dep:rustls", "dep:webpki-roots", "tokio/net", "tokio/rt-multi-thread"]
# Remote workers: the engine hands checks to workers on other machines,
# over TLS. Also gives `checkd worker` and `checkd make-certs`.
workers = ["dep:tokio-rustls", "dep:rustls", "dep:rcgen", "tokio/net"]
